name: smart-canteen-infra

services:
  mysql:
    build:
      context: ./mysql
      args:
        MYSQL_IMAGE: mysql:8.4.11
    image: smart-canteen/mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_canteen}
      MYSQL_USER: ${MYSQL_USER:-smart_canteen}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [smart-canteen]

  redis:
    build:
      context: ./redis
      args:
        REDIS_IMAGE: redis:7.4.10-alpine3.21
    image: smart-canteen/redis:7.4.10
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [smart-canteen]

  rabbitmq:
    build:
      context: ./rabbitmq
      args:
        RABBITMQ_IMAGE: rabbitmq:4.3.4-management-alpine
    image: smart-canteen/rabbitmq:4.3.4
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-smart_canteen}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-smart_canteen}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [smart-canteen]

networks:
  smart-canteen:
    name: smart-canteen-network

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
