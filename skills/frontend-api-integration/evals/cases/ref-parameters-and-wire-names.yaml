id: ref-parameters-and-wire-names
title: 解析参数引用并保留 wire 名称
description: |
  验证 Skill 能解析本地 reusable parameter references，编码路径参数，并在 TypeScript 标识符转换后仍保留原始 Header 和路径 wire 名称。

input:
  prompt: |
    请使用 frontend-api-integration Skill 处理 `contracts/resource.openapi.yaml`，为资源详情页生成请求层和契约测试。

    必须解析本地 `components.parameters` 引用。请在 workspace 根目录生成：

    - `api-ir.json`；
    - `client.ts`；
    - `client.contract.test.ts`。

    `client.ts` 中的 TypeScript 参数名可以是安全的 camelCase 标识符，但 HTTP 请求必须保留原始 `resource-id` 路径占位符和 `Idempotency-Key` Header 名称；路径参数必须经过 `encodeURIComponent`。不要把 wire 名称改成 TypeScript 名称。

context:
  repo_fixture: evals/fixtures/runtime
  files:
    contracts/resource.openapi.yaml: |
      openapi: 3.0.3
      info:
        title: Resource API
        version: 1.0.0
      paths:
        /api/v1/resources/{resource-id}:
          post:
            operationId: updateResource
            parameters:
              - $ref: '#/components/parameters/ResourceId'
              - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ResourcePatch'
            responses:
              '200':
                description: 更新结果
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ResourceResponse'
      components:
        parameters:
          ResourceId:
            name: resource-id
            in: path
            required: true
            schema:
              type: string
          IdempotencyKey:
            name: Idempotency-Key
            in: header
            required: true
            schema:
              type: string
        schemas:
          ResourcePatch:
            type: object
            required: [name]
            properties:
              name: {type: string}
          Resource:
            type: object
            required: [id, name]
            properties:
              id: {type: string}
              name: {type: string}
          ResourceResponse:
            type: object
            required: [code, message, data]
            properties:
              code: {type: integer}
              message: {type: string}
              data: {$ref: '#/components/schemas/Resource'}

collect_artifacts:
  - api-ir.json
  - client.ts
  - client.contract.test.ts

expect:
  exit_code: 0
  files_exist:
    - api-ir.json
    - client.ts
    - client.contract.test.ts
  file_contains:
    - path: client.ts
      content: encodeURIComponent
    - path: client.ts
      content: Idempotency-Key
    - path: client.ts
      content: resource-id
    - path: api-ir.json
      content: documentHash

judge:
  type: rule_based
  success:
    - files_exist:
        - api-ir.json
        - client.ts
        - client.contract.test.ts
    - output_contains:
        all: [encodeURIComponent, Idempotency-Key, resource-id, client.contract.test.ts]
