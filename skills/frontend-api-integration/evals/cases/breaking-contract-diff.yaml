id: breaking-contract-diff
title: 识别 breaking contract change 并先给出迁移计划
description: |
  验证 Skill 能比较旧/新契约，记录 contract hashes，识别必填化和枚举收窄，并在生成物更新前给出迁移任务。

input:
  prompt: |
    请使用 frontend-api-integration Skill 比较 `contracts/old.openapi.yaml` 和 `contracts/new.openapi.yaml`。

    请先分别规范化两个契约，再在 workspace 根目录生成：

    - `api-ir.before.json`；
    - `api-ir.after.json`；
    - `contract-diff.json`：必须记录 `beforeHash`、`afterHash` 和 `breaking`；
    - `migration-plan.md`：必须列出受影响的页面、client、mock、tests、发布顺序和回滚注意事项。

    新契约把可选的 `status` 查询参数改成必填，并收窄了 enum。请将其分类为 breaking，在迁移任务完成或获得批准前不要直接更新 typed client。

context:
  repo_fixture: evals/fixtures/runtime
  files:
    contracts/old.openapi.yaml: |
      openapi: 3.0.3
      info:
        title: Item API
        version: 1.0.0
      paths:
        /api/v1/items:
          get:
            operationId: listItems
            parameters:
              - name: status
                in: query
                required: false
                schema:
                  type: string
                  enum: [ACTIVE, INACTIVE]
            responses:
              '200':
                description: item list
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        items:
                          type: array
                          items: {type: string}
    contracts/new.openapi.yaml: |
      openapi: 3.0.3
      info:
        title: Item API
        version: 1.1.0
      paths:
        /api/v1/items:
          get:
            operationId: listItems
            parameters:
              - name: status
                in: query
                required: true
                schema:
                  type: string
                  enum: [ACTIVE]
            responses:
              '200':
                description: item list
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        items:
                          type: array
                          items: {type: string}

collect_artifacts:
  - api-ir.before.json
  - api-ir.after.json
  - contract-diff.json
  - migration-plan.md

expect:
  exit_code: 0
  files_exist:
    - api-ir.before.json
    - api-ir.after.json
    - contract-diff.json
    - migration-plan.md
  file_contains:
    - path: contract-diff.json
      content: beforeHash
    - path: contract-diff.json
      content: afterHash
    - path: contract-diff.json
      content: breaking
    - path: migration-plan.md
      content: rollback

judge:
  type: rule_based
  success:
    - files_exist:
        - api-ir.before.json
        - api-ir.after.json
        - contract-diff.json
        - migration-plan.md
    - output_contains:
        all: [breaking, beforeHash, afterHash, migration]
