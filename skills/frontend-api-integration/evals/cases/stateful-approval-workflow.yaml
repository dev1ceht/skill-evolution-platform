id: stateful-approval-workflow
title: 保持审批闭环中的状态转换与单位信息
description: |
  验证 Skill 能把契约和页面工作流合并为可执行的集成计划，保留审批状态转换、
  幂等重试、单位字段和告警清除的先后关系，并为高价值边界生成验证工作。

input:
  prompt: |
    请使用 frontend-api-integration Skill，为 `RecipeApprovalPage` 集成
    `contracts/recipe-approval.openapi.yaml`，并读取 `src/features/recipeApproval/workflow.md`
    中已经确认的页面业务顺序。

    请先读取 references/api-ir.md、references/frontend-standards.md、
    references/testing-policy.md 和 references/versioning-policy.md。
    在 workspace 根目录生成：

    - `api-ir.json`：包含四个操作及其 JSON Pointer provenance；
    - `integration-plan.json`：明确列出从 getRecipeApproval 开始的页面数据边界，
      `PENDING_APPROVAL` 下才能 approve/reject，approve 成功后才能 receiveInventory，
      receiveInventory 成功后才允许 clearRecipeAlert；同时覆盖 loading、empty、error、retry、mock 和 test；
    - `client.contract.test.ts`：覆盖四个操作的 method/path、`expectedVersion`、`quantity`、`unit` 和
      `Idempotency-Key`；
    - `handoff.md`：记录状态机、失败时不可越过的步骤、服务端返回的 normalizedQuantity/normalizedUnit，
      以及剩余人工联调工作。

    不要把单位字段丢掉或擅自把数量转换成另一个单位；按 workflow.md 将用户输入的 quantity 和 unit
    发送给后端，并消费后端返回的 normalizedQuantity/normalizedUnit。相同用户动作的重试必须复用同一个
    `Idempotency-Key`。不要修改共享 HTTP 基础设施，也不要在失败步骤后自动清除告警。

context:
  repo_fixture: evals/fixtures/runtime
  files:
    contracts/recipe-approval.openapi.yaml: |
      openapi: 3.0.3
      info:
        title: Recipe Approval API
        version: 1.0.0
      security:
        - bearerAuth: []
      paths:
        /api/v1/recipes/{recipeId}/approval:
          get:
            operationId: getRecipeApproval
            parameters:
              - name: recipeId
                in: path
                required: true
                schema: {type: string}
            responses:
              '200':
                description: 审批详情
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ApprovalResponse'
        /api/v1/recipes/{recipeId}/approval/approve:
          post:
            operationId: approveRecipe
            parameters:
              - name: recipeId
                in: path
                required: true
                schema: {type: string}
              - name: Idempotency-Key
                in: header
                required: true
                schema: {type: string}
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ApprovalDecision'
            responses:
              '200':
                description: 审批通过
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ApprovalResponse'
              '409':
                description: 版本或状态冲突
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'
        /api/v1/recipes/{recipeId}/inventory/receive:
          post:
            operationId: receiveInventory
            parameters:
              - name: recipeId
                in: path
                required: true
                schema: {type: string}
              - name: Idempotency-Key
                in: header
                required: true
                schema: {type: string}
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/InventoryReceiptRequest'
            responses:
              '200':
                description: 入库结果
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/InventoryReceiptResponse'
              '409':
                description: 审批尚未通过或版本冲突
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'
        /api/v1/recipes/{recipeId}/alerts/{alertId}/clear:
          post:
            operationId: clearRecipeAlert
            parameters:
              - name: recipeId
                in: path
                required: true
                schema: {type: string}
              - name: alertId
                in: path
                required: true
                schema: {type: string}
              - name: Idempotency-Key
                in: header
                required: true
                schema: {type: string}
            responses:
              '200':
                description: 告警清除结果
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/AlertResponse'
              '409':
                description: 入库尚未完成
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'
      components:
        securitySchemes:
          bearerAuth:
            type: http
            scheme: bearer
        schemas:
          ApprovalState:
            type: string
            enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED]
          Alert:
            type: object
            required: [id, code, status]
            properties:
              id: {type: string}
              code: {type: string}
              status: {type: string, enum: [OPEN, CLEARED]}
          RecipeApproval:
            type: object
            required: [recipeId, state, version, alerts]
            properties:
              recipeId: {type: string}
              state:
                $ref: '#/components/schemas/ApprovalState'
              version: {type: integer}
              alerts:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
          ApprovalDecision:
            type: object
            required: [expectedVersion]
            properties:
              expectedVersion: {type: integer}
              reason: {type: string}
          InventoryReceiptRequest:
            type: object
            required: [quantity, unit]
            properties:
              quantity: {type: number}
              unit: {type: string, enum: [GRAM, KILOGRAM]}
          InventoryReceipt:
            type: object
            required: [recipeId, normalizedQuantity, normalizedUnit]
            properties:
              recipeId: {type: string}
              normalizedQuantity: {type: number}
              normalizedUnit: {type: string, enum: [GRAM, KILOGRAM]}
          ApprovalResponse:
            type: object
            required: [code, message, data]
            properties:
              code: {type: integer}
              message: {type: string}
              data:
                $ref: '#/components/schemas/RecipeApproval'
          InventoryReceiptResponse:
            type: object
            required: [code, message, data]
            properties:
              code: {type: integer}
              message: {type: string}
              data:
                $ref: '#/components/schemas/InventoryReceipt'
          AlertResponse:
            type: object
            required: [code, message, data]
            properties:
              code: {type: integer}
              message: {type: string}
              data:
                $ref: '#/components/schemas/Alert'
          ErrorResponse:
            type: object
            required: [code, message]
            properties:
              code: {type: integer}
              message: {type: string}
    src/features/recipeApproval/workflow.md: |
      # Recipe approval page workflow

      - 页面打开时先调用 getRecipeApproval。
      - 只有 state=PENDING_APPROVAL 且 expectedVersion 与当前 version 一致时，用户动作才可以 approveRecipe 或 rejectRecipe。
      - approveRecipe 成功后才允许 receiveInventory；receiveInventory 失败时不得继续清除告警。
      - receiveInventory 请求必须原样携带用户输入的 quantity 和 unit；服务端返回 normalizedQuantity 和 normalizedUnit，页面展示服务端值。
      - 只有 receiveInventory 成功后，才允许对仍为 OPEN 的告警调用 clearRecipeAlert。
      - 同一个用户动作的重试复用原 Idempotency-Key；新的用户动作使用新的 key。

collect_artifacts:
  - api-ir.json
  - integration-plan.json
  - client.contract.test.ts
  - handoff.md

expect:
  exit_code: 0
  files_exist:
    - api-ir.json
    - integration-plan.json
    - client.contract.test.ts
    - handoff.md
  file_contains:
    - path: api-ir.json
      content: getRecipeApproval
    - path: api-ir.json
      content: clearRecipeAlert
    - path: integration-plan.json
      content: PENDING_APPROVAL
    - path: integration-plan.json
      content: receiveInventory
    - path: integration-plan.json
      content: clearRecipeAlert
    - path: integration-plan.json
      content: Idempotency-Key
    - path: integration-plan.json
      content: normalizedQuantity
    - path: client.contract.test.ts
      content: expectedVersion
    - path: client.contract.test.ts
      content: quantity
    - path: client.contract.test.ts
      content: unit
    - path: handoff.md
      content: retry

judge:
  type: rule_based
  success:
    - files_exist:
        - api-ir.json
        - integration-plan.json
        - client.contract.test.ts
        - handoff.md
    - output_contains:
        all: [integration-plan.json, PENDING_APPROVAL, Idempotency-Key, normalizedQuantity, clearRecipeAlert]
