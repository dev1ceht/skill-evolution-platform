id: basic-integration-plan
title: 生成可追溯的前端 API 集成计划
description: |
  验证 Skill 能从一个带分页和统一响应包络的 OpenAPI 契约，生成 API IR、页面级集成计划和交接说明，并覆盖页面状态与验证工作。

input:
  prompt: |
    请使用已安装的 frontend-api-integration Skill，为 `MenuApprovalPage` 集成
    `contracts/menu.openapi.yaml` 中的菜单查询和提交接口。

    请先读取相关 references，并以契约为证据，不要补写契约中没有的字段或认证行为。
    在 workspace 根目录生成以下文件：

    - `api-ir.json`：包含 `documentHash`、每个 operation 的 JSON Pointer provenance；
    - `integration-plan.json`：包含页面名 `MenuApprovalPage`、依赖、loading/empty/error 状态、mock 工作和验证工作；
    - `handoff.md`：记录生成文件、假设、测试证据和剩余人工工作。

    保留现有 `src/api/httpClient.ts`，不要修改共享 HTTP 基础设施。

context:
  repo_fixture: evals/fixtures/runtime
  files:
    contracts/menu.openapi.yaml: |
      openapi: 3.0.3
      info:
        title: Menu Approval API
        version: 1.0.0
      security:
        - bearerAuth: []
      paths:
        /api/v1/menus:
          get:
            operationId: listMenus
            tags: [menu-approval]
            parameters:
              - name: page
                in: query
                required: false
                schema:
                  type: integer
                  minimum: 1
              - name: size
                in: query
                required: false
                schema:
                  type: integer
                  minimum: 1
            responses:
              '200':
                description: 菜单分页
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/MenuPageResponse'
        /api/v1/menus/{menuId}/submit:
          post:
            operationId: submitMenu
            tags: [menu-approval]
            parameters:
              - name: menuId
                in: path
                required: true
                schema:
                  type: string
            responses:
              '200':
                description: 提交结果
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/MenuResponse'
              '400':
                description: 业务错误
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'
      components:
        securitySchemes:
          bearerAuth:
            type: http
            scheme: bearer
        schemas:
          Menu:
            type: object
            required: [id, status]
            properties:
              id: {type: string}
              status: {type: string, enum: [DRAFT, PENDING_APPROVAL, APPROVED]}
          MenuPage:
            type: object
            required: [items, total, page, size]
            properties:
              items:
                type: array
                items: {$ref: '#/components/schemas/Menu'}
              total: {type: integer}
              page: {type: integer}
              size: {type: integer}
          MenuPageResponse:
            type: object
            required: [code, message, data]
            properties:
              code: {type: integer}
              message: {type: string}
              data: {$ref: '#/components/schemas/MenuPage'}
          MenuResponse:
            type: object
            required: [code, message, data]
            properties:
              code: {type: integer}
              message: {type: string}
              data: {$ref: '#/components/schemas/Menu'}
          ErrorResponse:
            type: object
            required: [code, message]
            properties:
              code: {type: integer}
              message: {type: string}
    src/api/httpClient.ts: |
      export async function request<T>(input: string, init?: RequestInit): Promise<T> {
        const response = await fetch(input, init);
        return response.json() as Promise<T>;
      }

collect_artifacts:
  - api-ir.json
  - integration-plan.json
  - handoff.md

expect:
  exit_code: 0
  files_exist:
    - api-ir.json
    - integration-plan.json
    - handoff.md
  file_contains:
    - path: api-ir.json
      content: documentHash
    - path: api-ir.json
      content: submitMenu
    - path: integration-plan.json
      content: MenuApprovalPage

judge:
  type: rule_based
  success:
    - files_exist:
        - api-ir.json
        - integration-plan.json
        - handoff.md
    - output_contains:
        all: [api-ir.json, integration-plan.json, loading, empty, error, test]
