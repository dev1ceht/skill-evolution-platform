name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project validation tools
        run: python -m pip install --editable ".[dev]"
      - name: Run SOP and contract tests
        run: python -m pytest
      - name: Validate the business SOP run
        run: >-
          python skills/smart-canteen-sop/scripts/validate_sop_manifest.py
          --run sop-runs/menu-to-traceability.yaml
      - name: Normalize the OpenAPI contract
        run: >-
          python skills/frontend-api-integration/scripts/normalize_openapi.py
          contracts/smart-canteen.openapi.yaml
          -o contracts/generated/api-ir.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn --batch-mode test

  runtime:
    needs: [quality, frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Create ephemeral middleware credentials
        shell: pwsh
        run: |
          $values = @(
            "MYSQL_DATABASE=smart_canteen"
            "MYSQL_USER=smart_canteen"
            "MYSQL_PASSWORD=$([guid]::NewGuid().ToString('N'))"
            "MYSQL_ROOT_PASSWORD=$([guid]::NewGuid().ToString('N'))"
            "REDIS_PASSWORD=$([guid]::NewGuid().ToString('N'))"
            "RABBITMQ_USER=smart_canteen"
            "RABBITMQ_PASSWORD=$([guid]::NewGuid().ToString('N'))"
            "RABBITMQ_VHOST=smart_canteen"
          )
          [IO.File]::WriteAllLines(
            "infra/.env",
            $values,
            [Text.UTF8Encoding]::new($false)
          )
      - name: Remove stale verification evidence
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue outputs/verification/smart-canteen-runtime-latest.json, outputs/verification/smart-canteen-mysql-workflow-latest.json
      - name: Build and verify Docker middleware
        shell: pwsh
        run: ./infra/verify-stack.ps1
      - name: Verify workflow against real MySQL
        shell: pwsh
        run: ./infra/verify-mysql-workflow.ps1
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smart-canteen-runtime-evidence
          path: outputs/verification/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove middleware and volumes
        if: always()
        run: >-
          docker compose
          --env-file infra/.env
          -f infra/compose.yaml
          down --volumes --remove-orphans
