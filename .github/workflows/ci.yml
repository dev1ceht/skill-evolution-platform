name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install platform
        run: python -m pip install --editable '.[dev]'
      - name: Test platform, replay, and evolution
        run: python -m pytest
      - name: Exercise end-to-end evolution demo
        run: python -m skill_evolution.cli demo
      - name: Build auditable benchmark report
        run: >-
          python -m skill_evolution.cli benchmark
          --input examples/benchmarks/synthetic-sample.csv
          --name ci
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-evidence
          path: outputs/benchmarks/ci.*
          if-no-files-found: error
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/smart-canteen/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: examples/smart-canteen/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/smart-canteen/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: examples/smart-canteen/backend/pom.xml
      - run: mvn --batch-mode test

  runtime:
    needs: [platform, frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: examples/smart-canteen/backend/pom.xml
      - name: Create ephemeral middleware credentials
        shell: pwsh
        run: |
          $values = @(
            "MYSQL_DATABASE=smart_canteen"
            "MYSQL_USER=smart_canteen"
            "MYSQL_PASSWORD=$([guid]::NewGuid().ToString('N'))"
            "MYSQL_ROOT_PASSWORD=$([guid]::NewGuid().ToString('N'))"
            "REDIS_PASSWORD=$([guid]::NewGuid().ToString('N'))"
            "RABBITMQ_USER=smart_canteen"
            "RABBITMQ_PASSWORD=$([guid]::NewGuid().ToString('N'))"
            "RABBITMQ_VHOST=smart_canteen"
          )
          [IO.File]::WriteAllLines(
            "examples/smart-canteen/infra/.env",
            $values,
            [Text.UTF8Encoding]::new($false)
          )
      - name: Remove stale verification evidence
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue `
            outputs/verification/smart-canteen-runtime-latest.json, `
            outputs/verification/smart-canteen-mysql-workflow-latest.json
      - name: Build and verify Docker middleware
        shell: pwsh
        run: ./examples/smart-canteen/infra/verify-stack.ps1
      - name: Verify workflow against real MySQL
        shell: pwsh
        run: ./examples/smart-canteen/infra/verify-mysql-workflow.ps1
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smart-canteen-runtime-evidence
          path: outputs/verification/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove middleware and volumes
        if: always()
        run: >-
          docker compose
          --env-file examples/smart-canteen/infra/.env
          -f examples/smart-canteen/infra/compose.yaml
          down --volumes --remove-orphans
