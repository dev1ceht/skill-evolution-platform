openapi: 3.0.3
info:
  title: Smart Canteen Workflow API
  version: 1.0.0
  description: 菜单审批、采购缺口、库存入库和台账预警的最小业务闭环。
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/v1/assistant/conversations/{conversationId}/messages:
    get:
      operationId: getAssistantConversationHistory
      tags: [assistant]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: 当前用户在当前范围内的助手会话历史
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantConversationHistoryResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      operationId: sendAssistantMessage
      tags: [assistant]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantMessageRequest'
      responses:
        '200':
          description: 助手澄清、未支持提示、只读业务结果，或带 Agent Run 计划的菜单发布确认/取消结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantTurnResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/agent/runs:
    post:
      operationId: startAgentRun
      tags: [agent]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunStartRequest'
      responses:
        '200':
          description: 创建并执行只读 Agent Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/agent/runs/{runId}:
    get:
      operationId: getAgentRun
      tags: [agent]
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      responses:
        '200':
          description: Agent Run 当前状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/agent/runs/{runId}/decisions:
    post:
      operationId: decideAgentRun
      tags: [agent]
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunDecisionRequest'
      responses:
        '200':
          description: 运行级确认、拒绝或取消后的 Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/agent/runs/{runId}/cancel:
    post:
      operationId: cancelAgentRun
      tags: [agent]
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunVersionRequest'
      responses:
        '200':
          description: 已取消的 Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/agent/runs/{runId}/resume:
    post:
      operationId: resumeAgentRun
      tags: [agent]
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunVersionRequest'
      responses:
        '200':
          description: 恢复或转入人工对账后的 Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/agent/runs/{runId}/events:
    get:
      operationId: getAgentRunEvents
      tags: [agent]
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      responses:
        '200':
          description: Run 只追加事件时间线
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunEventListResponse'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/agent/skills:
    get:
      operationId: listAgentSkills
      tags: [agent]
      responses:
        '200':
          description: 已加载的 Skill Registry 快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSkillListResponse'
  /api/v1/agent/metrics:
    get:
      operationId: getAgentMetrics
      tags: [agent]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
        - $ref: '#/components/parameters/RequestId'
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: 指标窗口起点，默认最近 24 小时。
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: 指标窗口终点，默认当前时间；窗口最长 31 天。
      responses:
        '200':
          description: 当前食堂范围内的 Agent 运行聚合指标，不包含运行或用户标识。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMetricsResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/procurement-plans:
    get:
      operationId: listProcurementPlans
      tags: [procurement]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, CONFIRMED, CONVERTED, CANCELLED]
        - $ref: '#/components/parameters/OperationalPage'
        - $ref: '#/components/parameters/OperationalSize'
      responses:
        '200':
          description: 分页采购计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanAggregatePageResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/{planId}:
    get:
      operationId: getProcurementPlan
      tags: [procurement]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      responses:
        '200':
          description: 采购计划详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanAggregateResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/generate-range:
    post:
      operationId: generateProcurementPlanRange
      tags: [procurement]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateProcurementRangeRequest'
      responses:
        '200':
          description: 按已发布菜单/食谱、库存和在途采购快照生成采购计划 Draft；不会创建采购订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanAggregateResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/{planId}/items:
    put:
      operationId: adjustProcurementPlan
      tags: [procurement]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustProcurementPlanRequest'
      responses:
        '200':
          description: 调整后的采购计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanAggregateResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/{planId}/confirm:
    post:
      operationId: confirmProcurementPlan
      tags: [procurement]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      responses:
        '200':
          description: 已确认采购计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanAggregateResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/{planId}/cancel:
    post:
      operationId: cancelProcurementPlan
      tags: [procurement]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      responses:
        '200':
          description: 已取消采购计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanAggregateResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/{planId}/purchase-orders:
    post:
      operationId: createPurchaseOrderFromPlan
      tags: [procurement]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcurementOrderRequest'
      responses:
        '200':
          description: 由采购计划创建的采购订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/alerts:
    post:
      operationId: reportAlert
      tags: [alert-center]
      description: 接收区县平台、明厨亮灶或晨检仪归一化后的预警；相同 source 与 thirdWarnId 重复提交返回原记录，内容变化返回业务错误。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertReportRequest'
      responses:
        '200':
          description: 预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
    get:
      operationId: queryAlerts
      tags: [alert-center]
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
        - $ref: '#/components/parameters/AlertSource'
        - $ref: '#/components/parameters/AlertStatus'
        - $ref: '#/components/parameters/AlarmEventId'
        - $ref: '#/components/parameters/DeviceName'
        - $ref: '#/components/parameters/StartDateTime'
        - $ref: '#/components/parameters/EndDateTime'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分页预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPageResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/alerts/{warnId}/disposal:
    post:
      operationId: disposeAlert
      tags: [alert-center]
      description: 处置预警；同一记录重复提交相同处置结果是幂等的，已处置记录不能被不同结果覆盖。
      parameters:
        - $ref: '#/components/parameters/WarnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertDisposalRequest'
      responses:
        '200':
          description: 更新后的预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/auth/refresh-token:
    post:
      operationId: refreshToken
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated login tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Refresh session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /api/v1/auth/me:
    get:
      operationId: currentUser
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/ingredients:
    get:
      operationId: listIngredients
      tags: [catalog]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
        - name: keyword
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalPage'
        - $ref: '#/components/parameters/OperationalSize'
      responses:
        '200':
          description: Ingredient page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientPageResponse'
    post:
      operationId: createIngredient
      tags: [catalog]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientRequest'
      responses:
        '200':
          description: Ingredient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientResponse'
  /api/v1/ingredients/{ingredientId}:
    put:
      operationId: updateIngredient
      tags: [catalog]
      parameters:
        - name: ingredientId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientRequest'
      responses:
        '200':
          description: Ingredient updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientResponse'
  /api/v1/ingredients/{ingredientId}/units:
    get:
      operationId: listIngredientUnits
      tags: [catalog]
      parameters:
        - name: ingredientId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      responses:
        '200':
          description: 食材业务单位及基础单位换算
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientUnitListResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
    put:
      operationId: replaceIngredientUnits
      tags: [catalog]
      parameters:
        - name: ingredientId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientUnitsRequest'
      responses:
        '200':
          description: 食材业务单位配置已替换
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientUnitListResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/dishes:
    get:
      operationId: listDishes
      tags: [catalog]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
        - name: keyword
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalPage'
        - $ref: '#/components/parameters/OperationalSize'
      responses:
        '200':
          description: Dish page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishPageResponse'
    post:
      operationId: createDish
      tags: [catalog]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishRequest'
      responses:
        '200':
          description: Dish created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishResponse'
  /api/v1/dishes/{dishId}:
    put:
      operationId: updateDish
      tags: [catalog]
      parameters:
        - name: dishId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishRequest'
      responses:
        '200':
          description: Dish updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishResponse'
  /api/v1/diner/menus:
    get:
      operationId: listDinerMenus
      tags: [diner]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: mealTime
          in: query
          required: false
          schema: { type: string, enum: [BREAKFAST, LUNCH, DINNER, SNACK] }
        - $ref: '#/components/parameters/OperationalPage'
        - $ref: '#/components/parameters/OperationalSize'
      responses:
        '200':
          description: 当前范围已公示菜单及菜品快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DinerMenuPageResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/meal-orders:
    get:
      operationId: listMealOrders
      tags: [diner]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [CREATED, CANCELLED] }
        - $ref: '#/components/parameters/OperationalPage'
        - $ref: '#/components/parameters/OperationalSize'
      responses:
        '200':
          description: 当前登录用户的个人消费订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealOrderPageResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '403':
