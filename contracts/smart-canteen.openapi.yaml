            schema: { $ref: '#/components/schemas/ComplaintReviewRequest' }
      responses:
        '200':
          description: 投诉受理结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierComplaintResponse' }
        '400': { $ref: '#/components/responses/BusinessError' }
  /api/v1/supplier-complaints/{complaintId}/process:
    post:
      operationId: processSupplierComplaint
      tags: [governance]
      parameters:
        - name: complaintId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200':
          description: 投诉处理中
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierComplaintResponse' }
        '400': { $ref: '#/components/responses/BusinessError' }
  /api/v1/supplier-complaints/{complaintId}/reply:
    post:
      operationId: replySupplierComplaint
      tags: [governance]
      parameters:
        - name: complaintId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComplaintReplyRequest' }
      responses:
        '200':
          description: 投诉回复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierComplaintResponse' }
        '400': { $ref: '#/components/responses/BusinessError' }
  /api/v1/supplier-complaints/{complaintId}/close:
    post:
      operationId: closeSupplierComplaint
      tags: [governance]
      parameters:
        - name: complaintId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200':
          description: 投诉关闭
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierComplaintResponse' }
        '400': { $ref: '#/components/responses/BusinessError' }
  /api/v1/supplier-complaints/{complaintId}/history:
    get:
      operationId: listSupplierComplaintHistory
      tags: [governance]
      parameters:
        - name: complaintId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      responses:
        '200':
          description: 投诉操作历史
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovernanceHistoryListResponse' }
        '400': { $ref: '#/components/responses/BusinessError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SchoolIdPath:
      name: schoolId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SchoolIdQuery:
      name: schoolId
      in: query
      required: false
      schema:
        type: string
    CanteenIdPath:
      name: canteenId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CanteenIdQuery:
      name: canteenId
      in: query
      required: false
      schema:
        type: string
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SchoolId:
      name: schoolId
      in: query
      required: false
      description: 学校范围；与 canteenId 一起提供时限定到具体食堂。
      schema:
        type: string
    CanteenId:
      name: canteenId
      in: query
      required: false
      description: 食堂范围；与 schoolId 一起提供时限定到具体食堂。
      schema:
        type: string
    AlertSource:
      name: source
      in: query
      required: false
      schema:
        type: string
        enum: [DISTRICT_PLATFORM, BRIGHT_KITCHEN, MORNING_INSPECTION, LEDGER, COMPLIANCE]
    AlertStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [UNPROCESSED, PROCESSED]
    AlarmEventId:
      name: alarmEventId
      in: query
      required: false
      description: 警情类型 ID，例如未戴帽子、手温异常或食材价格预警。
      schema:
        type: string
    DeviceName:
      name: deviceName
      in: query
      required: false
      schema:
        type: string
    StartDateTime:
      name: startDate
      in: query
      required: false
      schema:
        type: string
        format: date-time
    EndDateTime:
      name: endDate
      in: query
      required: false
      schema:
        type: string
        format: date-time
    PageNum:
      name: pageNum
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WarnId:
      name: warnId
      in: path
      required: true
      schema:
        type: string
    OperationalSchoolId:
      name: schoolId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    OperationalCanteenId:
      name: canteenId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    OperationalPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    OperationalSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 请求追踪 ID；省略时由服务端生成。
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BusinessError:
      description: 业务规则或参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: User is not allowed to access this scope or Skill
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AssistantMessageRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: 用户本轮自然语言消息；身份和业务范围不从消息中读取。
    MenuQueryIntent:
      description: 按菜单 ID 或日期查询已发布菜单，二者必须且只能提供一个。
      oneOf:
        - type: object
          required: [menuId]
          additionalProperties: false
          properties:
            menuId:
              $ref: '#/components/schemas/MenuId'
        - type: object
          required: [menuDate]
          additionalProperties: false
          properties:
            menuDate: { type: string, format: date }
            mealTime: { type: string, enum: [BREAKFAST, LUNCH, DINNER, SNACK] }
    InventoryQueryIntent:
      type: object
      description: 在服务端已确定的食堂范围内查询库存；warningOnly=true 只返回数量不高于预警阈值的食材。
      additionalProperties: false
      properties:
        keyword:
          type: string
          maxLength: 100
          nullable: true
          description: 食材 ID 或名称的可选筛选词。
        warningOnly:
          type: boolean
          default: false
          description: 是否只返回库存预警记录。
    ProcurementGapQueryIntent:
      type: object
      description: 比较指定日期已发布菜单的 Recipe/BOM 需求与当前库存、未完成采购快照；只读，不创建采购计划。
      required: [menuDate]
      additionalProperties: false
      properties:
        menuDate: { type: string, format: date }
        mealTime: { type: string, enum: [BREAKFAST, LUNCH, DINNER, SNACK] }
    TrafficForecastQueryIntent:
      type: object
      description: 读取指定范围内版本化客流预测事实；没有事实时返回不可用，不由模型猜测人数。
      required: [forecastDate, mealTime]
      additionalProperties: false
      properties:
        forecastDate: { type: string, format: date }
        mealTime: { type: string, enum: [BREAKFAST, LUNCH, DINNER, SNACK] }
    MealPlanQueryIntent:
      type: object
      description: 基于客流预测事实和指定日期已发布菜单，生成只读备餐数量建议，不创建业务计划。
      required: [menuDate, mealTime]
      additionalProperties: false
      properties:
        menuDate: { type: string, format: date }
        mealTime: { type: string, enum: [BREAKFAST, LUNCH, DINNER, SNACK] }
    AssistantTurn:
      type: object
      description: 助手响应；菜单发布以及采购、库存、预警写入必须先返回确认计划，之后仅由明确确认或取消推进 Agent Run。写入入口仍受部署灰度开关、scope、权限和幂等策略约束。
      required: [conversationId, turnId, sequence, kind, message, missingFields, createdAt]
      properties:
        conversationId: { type: string }
        turnId: { type: string }
        sequence: { type: integer, format: int64, minimum: 1 }
        kind:
          type: string
          enum: [CLARIFICATION, UNSUPPORTED, RESULT, CONFIRMATION_REQUIRED]
        message: { type: string }
        intent: { type: string, nullable: true }
        runId: { type: string, nullable: true }
        runStatus: { type: string, nullable: true }
        result:
          type: object
          additionalProperties: true
          nullable: true
        missingFields:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    AssistantTurnResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/AssistantTurn' }
    AssistantConversationHistoryEntry:
      type: object
      required: [userMessage, response]
      properties:
        userMessage: { type: string }
        response: { $ref: '#/components/schemas/AssistantTurn' }
    AssistantConversationHistory:
      type: object
      required: [conversationId, status, turns]
      properties:
        conversationId: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        turns:
          type: array
          items: { $ref: '#/components/schemas/AssistantConversationHistoryEntry' }
    AssistantConversationHistoryResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/AssistantConversationHistory' }
    AgentRunStartRequest:
      type: object
      required: [intent, input]
      properties:
        intent: { type: string, minLength: 1 }
        input:
          type: object
          additionalProperties: true
          description: 结构化 Skill 输入；身份和业务范围不从此对象读取。
    TraceabilityIntent:
      type: object
      required: [traceCode]
      additionalProperties: false
      properties:
        traceCode:
          type: string
          minLength: 1
          description: 批次、出库或追溯码；必须在请求范围内可解析。
    MenuPublishIntent:
      type: object
      required: [menuId, menuVersion]
      additionalProperties: false
      properties:
        menuId:
          $ref: '#/components/schemas/MenuId'
        menuVersion: { type: integer, format: int64, minimum: 0 }
        decision:
          type: string
          enum: [APPROVE, REJECT]
        comment: { type: string, maxLength: 500, nullable: true }
    AgentRunDecisionRequest:
      type: object
      required: [version, decisionType]
      additionalProperties: false
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        decisionType:
          type: string
          enum: [RUN_CONFIRM, RUN_REJECT, RUN_CANCEL]
        comment: { type: string, maxLength: 500, nullable: true }
    AgentRunVersionRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int64, minimum: 0 }
    AgentRunEvent:
      type: object
      required: [eventId, runId, eventSequence, eventType, toStatus, occurredAt]
      properties:
        eventId: { type: string }
        runId: { type: string }
        eventSequence: { type: integer, format: int64 }
        eventType: { type: string }
        fromStatus: { type: string, nullable: true }
        toStatus: { type: string }
        actorUserId: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true, nullable: true }
        occurredAt: { type: string, format: date-time }
    AgentRunEventListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/AgentRunEvent' }
    AgentRun:
      type: object
      required:
        - runId
        - version
        - status
        - intent
        - skillId
        - skillVersion
        - manifestDigest
        - planHash
        - plan
        - createdAt
        - updatedAt
      properties:
        runId: { type: string }
        version: { type: integer, format: int64, minimum: 0 }
        status:
          type: string
          enum: [RECEIVED, PLANNED, WAITING_CLARIFICATION, WAITING_CONFIRMATION, EXECUTING, SUCCEEDED, FAILED, REJECTED, CANCELLED, TIMED_OUT, RECONCILIATION_REQUIRED]
        intent: { type: string }
        actorUserId: { type: string }
        actorUsername: { type: string }
        schoolId: { type: string }
        canteenId: { type: string }
        skillId: { type: string }
        skillVersion: { type: string }
        manifestDigest: { type: string }
        planHash: { type: string }
        plan: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true, nullable: true }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        currentStep: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentRunResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/AgentRun' }
    AgentRuntimePolicy:
      type: object
      required: [intents, inputSchema, outputSchema, tools, toolByIntent, sideEffect, runConfirmation, domainApproval, activation, deadlineMs, retryPolicy, evidence]
      properties:
        intents: { type: array, items: { type: string } }
        inputSchema: { type: string }
        outputSchema: { type: string }
        tools: { type: array, items: { type: string } }
        toolByIntent:
          type: object
          additionalProperties: { type: string }
        sideEffect: { type: string, enum: [read, write] }
        runConfirmation: { type: string }
        domainApproval: { type: string }
        activation: { type: string }
        deadlineMs: { type: integer, format: int64, minimum: 1 }
        retryPolicy: { type: string }
        evidence: { type: string }
    AgentSkill:
      type: object
      required: [id, version, status, riskLevel, approval, scope, permissions, manifestDigest, available]
      properties:
        id: { type: string }
        version: { type: string }
        status: { type: string }
        riskLevel: { type: string }
        approval: { type: string }
        scope: { type: string }
        permissions: { type: array, items: { type: string } }
        manifestDigest: { type: string }
        available: { type: boolean }
        runtime: { $ref: '#/components/schemas/AgentRuntimePolicy' }
    AgentSkillListResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/AgentSkill' }
    AgentMetrics:
      type: object
      required:
        - schoolId
        - canteenId
        - from
        - to
        - totalRuns
        - succeededRuns
        - failedRuns
        - rejectedRuns
        - cancelledRuns
        - timedOutRuns
        - reconciliationRequiredRuns
        - waitingConfirmationRuns
        - successRate
        - averageRunDurationMs
        - averageConfirmationWaitMs
        - toolExecutions
        - toolFailures
        - averageToolDurationMs
        - idempotencyReplayCount
        - authorizationDeniedCount
      properties:
        schoolId: { type: string }
        canteenId: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        totalRuns: { type: integer, format: int64 }
        succeededRuns: { type: integer, format: int64 }
        failedRuns: { type: integer, format: int64 }
        rejectedRuns: { type: integer, format: int64 }
        cancelledRuns: { type: integer, format: int64 }
        timedOutRuns: { type: integer, format: int64 }
        reconciliationRequiredRuns: { type: integer, format: int64 }
        waitingConfirmationRuns: { type: integer, format: int64 }
        successRate: { type: number, format: double, minimum: 0, maximum: 1 }
        averageRunDurationMs: { type: integer, format: int64, minimum: 0 }
        averageConfirmationWaitMs: { type: integer, format: int64, minimum: 0 }
        toolExecutions: { type: integer, format: int64 }
        toolFailures: { type: integer, format: int64 }
        averageToolDurationMs: { type: integer, format: int64, minimum: 0 }
        idempotencyReplayCount: { type: integer, format: int64 }
        authorizationDeniedCount: { type: integer, format: int64 }
    AgentMetricsResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/AgentMetrics' }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, format: password }
        loginType: { type: string, default: account }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    LogoutRequest:
      type: object
      properties:
        refreshToken: { type: string, nullable: true }
    AuthUserInfo:
      type: object
      required: [userId, username, nickname, role]
      properties:
        userId: { type: string }
        username: { type: string }
        nickname: { type: string }
        role: { type: string }
        roles:
          type: array
          items: { type: string }
        schoolId: { type: string, nullable: true }
        canteenId: { type: string, nullable: true }
    AuthTokens:
      type: object
      required: [token, refreshToken, expiresIn, userInfo]
      properties:
        token: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, format: int64 }
        userInfo:
          $ref: '#/components/schemas/AuthUserInfo'
    CurrentUser:
      type: object
      required: [userId, username, nickname, role, roles, permissions]
      properties:
        userId: { type: string }
        username: { type: string }
        nickname: { type: string }
        role: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        schoolId: { type: string, nullable: true }
        canteenId: { type: string, nullable: true }
    EmptyResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { nullable: true }
    AuthTokensResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          $ref: '#/components/schemas/AuthTokens'
    CurrentUserResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          $ref: '#/components/schemas/CurrentUser'
    School:
      type: object
      required: [id, name, regionCode, active]
      properties:
        id: { type: string }
        name: { type: string }
        regionCode: { type: string }
        active: { type: boolean }
    SchoolRequest:
      type: object
      required: [name, regionCode]
      properties:
        id: { type: string, nullable: true }
        name: { type: string, minLength: 1 }
        regionCode: { type: string, minLength: 1 }
        active: { type: boolean, default: true }
    Canteen:
      type: object
      required: [id, schoolId, name, regionCode, active]
      properties:
        id: { type: string }
        schoolId: { type: string }
        name: { type: string }
        address: { type: string, nullable: true }
        regionCode: { type: string }
        active: { type: boolean }
    CanteenRequest:
      type: object
      required: [name]
      properties:
        id: { type: string, nullable: true }
        schoolId: { type: string, nullable: true }
        name: { type: string, minLength: 1 }
        address: { type: string, nullable: true }
        active: { type: boolean, default: true }
    FoundationStatusRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    RoleDefinition:
      type: object
      required: [code, name, systemRole, active, permissions]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        systemRole: { type: boolean }
        active: { type: boolean }
        permissions:
          type: array
          items: { type: string }
    PermissionDefinition:
      type: object
      required: [code, name, resource, action]
      properties:
        code: { type: string }
        name: { type: string }
        resource: { type: string }
        action: { type: string }
        description: { type: string, nullable: true }
    RolePermissionRequest:
      type: object
      properties:
        permissionCodes:
          type: array
          items: { type: string }
    ScopeGrant:
      type: object
      required: [assignmentId, userId, type]
      properties:
        assignmentId: { type: string }
        userId: { type: string }
        type: { type: string, enum: [REGION, SCHOOL, CANTEEN] }
        regionCode: { type: string, nullable: true }
        schoolId: { type: string, nullable: true }
        canteenId: { type: string, nullable: true }
    ScopeGrantRequest:
      type: object
      required: [type]
      properties:
        assignmentId: { type: string, nullable: true }
        type: { type: string, enum: [REGION, SCHOOL, CANTEEN] }
        regionCode: { type: string, nullable: true }
        schoolId: { type: string, nullable: true }
        canteenId: { type: string, nullable: true }
    ManagedUser:
      type: object
      required: [userId, username, displayName, primaryRole, roles, active, scopeGrants]
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        primaryRole: { type: string }
        roles:
          type: array
          items: { type: string }
        schoolId: { type: string, nullable: true }
        canteenId: { type: string, nullable: true }
        active: { type: boolean }
        scopeGrants:
