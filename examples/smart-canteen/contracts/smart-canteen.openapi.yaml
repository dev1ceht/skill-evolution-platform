components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MenuId:
      name: menuId
      in: path
      required: true
      schema:
        type: string
    SchoolIdPath:
      name: schoolId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SchoolIdQuery:
      name: schoolId
      in: query
      required: false
      schema:
        type: string
    CanteenIdPath:
      name: canteenId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CanteenIdQuery:
      name: canteenId
      in: query
      required: false
      schema:
        type: string
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SchoolId:
      name: schoolId
      in: query
      required: false
      description: 学校范围；必须与 canteenId 成对提供，省略时使用兼容默认范围。
      schema:
        type: string
    CanteenId:
      name: canteenId
      in: query
      required: false
      description: 食堂范围；必须与 schoolId 成对提供，省略时使用兼容默认范围。
      schema:
        type: string
    AlertSource:
      name: source
      in: query
      required: false
      schema:
        type: string
        enum: [DISTRICT_PLATFORM, BRIGHT_KITCHEN, MORNING_INSPECTION, LEDGER]
    AlertStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [UNPROCESSED, PROCESSED]
    AlarmEventId:
      name: alarmEventId
      in: query
      required: false
      description: 警情类型 ID，例如未戴帽子、手温异常或食材价格预警。
      schema:
        type: string
    DeviceName:
      name: deviceName
      in: query
      required: false
      schema:
        type: string
    StartDateTime:
      name: startDate
      in: query
      required: false
      schema:
        type: string
        format: date-time
    EndDateTime:
      name: endDate
      in: query
      required: false
      schema:
        type: string
        format: date-time
    PageNum:
      name: pageNum
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WarnId:
      name: warnId
      in: path
      required: true
      schema:
        type: string
    OperationalSchoolId:
      name: schoolId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    OperationalCanteenId:
      name: canteenId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    OperationalPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    OperationalSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BusinessError:
      description: 业务规则或参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, format: password }
        loginType: { type: string, default: account }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    LogoutRequest:
      type: object
      properties:
        refreshToken: { type: string, nullable: true }
    AuthUserInfo:
      type: object
      required: [userId, username, nickname, role]
      properties:
        userId: { type: string }
        username: { type: string }
        nickname: { type: string }
        role: { type: string }
        roles:
          type: array
          items: { type: string }
        schoolId: { type: string, nullable: true }
        canteenId: { type: string, nullable: true }
    AuthTokens:
      type: object
      required: [token, refreshToken, expiresIn, userInfo]
      properties:
        token: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, format: int64 }
        userInfo:
          $ref: '#/components/schemas/AuthUserInfo'
    CurrentUser:
      type: object
      required: [userId, username, nickname, role, roles, permissions]
      properties:
        userId: { type: string }
        username: { type: string }
        nickname: { type: string }
        role: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        schoolId: { type: string, nullable: true }
        canteenId: { type: string, nullable: true }
    EmptyResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { nullable: true }
    AuthTokensResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          $ref: '#/components/schemas/AuthTokens'
    CurrentUserResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          $ref: '#/components/schemas/CurrentUser'
    School:
      type: object
      required: [id, name, regionCode, active]
      properties:
        id: { type: string }
        name: { type: string }
        regionCode: { type: string }
        active: { type: boolean }
    SchoolRequest:
      type: object
      required: [name, regionCode]
      properties:
        id: { type: string, nullable: true }
        name: { type: string, minLength: 1 }
        regionCode: { type: string, minLength: 1 }
        active: { type: boolean, default: true }
    Canteen:
      type: object
      required: [id, schoolId, name, regionCode, active]
      properties:
        id: { type: string }
        schoolId: { type: string }
        name: { type: string }
        address: { type: string, nullable: true }
        regionCode: { type: string }
        active: { type: boolean }
    CanteenRequest:
      type: object
