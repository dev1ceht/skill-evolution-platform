openapi: 3.0.3
info:
  title: Smart Canteen Workflow API
  version: 1.0.0
  description: 菜单审批、采购缺口、库存入库和台账预警的最小业务闭环。
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/v1/menus/{menuId}/submit:
    post:
      operationId: submitMenu
      tags: [menu-approval]
      parameters:
        - $ref: '#/components/parameters/MenuId'
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      responses:
        '200':
          description: 菜单已提交审批
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/menu-approvals/{menuId}/decision:
    post:
      operationId: decideMenuApproval
      tags: [menu-approval]
      parameters:
        - $ref: '#/components/parameters/MenuId'
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: 审批结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/menus/{menuId}/recipe:
    post:
      operationId: importMenuRecipe
      tags: [recipe]
      parameters:
        - $ref: '#/components/parameters/MenuId'
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeImportRequest'
      responses:
        '200':
          description: 鑿滃崟椋熻氨瀵煎叆缁撴灉
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/generate:
    post:
      operationId: generateProcurementPlan
      tags: [procurement]
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateProcurementRequest'
      responses:
        '200':
          description: 基于已审批菜单和当前库存生成的采购缺口
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans:
    get:
      operationId: listProcurementPlans
      tags: [procurement]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, CONFIRMED, CONVERTED, CANCELLED]
        - $ref: '#/components/parameters/OperationalPage'
        - $ref: '#/components/parameters/OperationalSize'
      responses:
        '200':
          description: 分页采购计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanAggregatePageResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/{planId}:
    get:
      operationId: getProcurementPlan
      tags: [procurement]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      responses:
        '200':
          description: 采购计划详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanAggregateResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/generate-range:
    post:
      operationId: generateProcurementPlanRange
      tags: [procurement]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateProcurementRangeRequest'
      responses:
        '200':
          description: 按已发布食谱生成的采购计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanAggregateResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/{planId}/items:
    put:
      operationId: adjustProcurementPlan
      tags: [procurement]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustProcurementPlanRequest'
      responses:
        '200':
          description: 调整后的采购计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanAggregateResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/{planId}/confirm:
    post:
      operationId: confirmProcurementPlan
      tags: [procurement]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      responses:
        '200':
          description: 已确认采购计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanAggregateResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/{planId}/cancel:
    post:
      operationId: cancelProcurementPlan
      tags: [procurement]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      responses:
        '200':
          description: 已取消采购计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanAggregateResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/{planId}/purchase-orders:
    post:
      operationId: createPurchaseOrderFromPlan
      tags: [procurement]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcurementOrderRequest'
      responses:
        '200':
          description: 由采购计划创建的采购订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/inventory/receipts:
    post:
      operationId: receiveInventory
      tags: [inventory]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 防止入库单重复提交
          schema:
            type: string
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryReceipt'
      responses:
        '200':
          description: 入库后的基础单位库存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/alerts:
    post:
      operationId: reportAlert
      tags: [alert-center]
      description: 接收区县平台、明厨亮灶或晨检仪归一化后的预警；相同 source 与 thirdWarnId 重复提交返回原记录，内容变化返回业务错误。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertReportRequest'
      responses:
        '200':
          description: 预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
    get:
      operationId: queryAlerts
      tags: [alert-center]
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
        - $ref: '#/components/parameters/AlertSource'
        - $ref: '#/components/parameters/AlertStatus'
        - $ref: '#/components/parameters/AlarmEventId'
        - $ref: '#/components/parameters/DeviceName'
        - $ref: '#/components/parameters/StartDateTime'
        - $ref: '#/components/parameters/EndDateTime'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分页预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPageResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/alerts/{warnId}/disposal:
    post:
      operationId: disposeAlert
      tags: [alert-center]
      description: 处置预警；同一记录重复提交相同处置结果是幂等的，已处置记录不能被不同结果覆盖。
      parameters:
        - $ref: '#/components/parameters/WarnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertDisposalRequest'
      responses:
        '200':
          description: 更新后的预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /alarmApi/warn/report:
    post:
      operationId: reportExternalAlert
      tags: [alert-center-compatibility]
      description: 设计文档规定的外部预警接收兼容入口；接受本地时间格式并允许非 AI 事件缺省 thirdWarnId，内部归一化后使用统一 ApiResponse 包络。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAlertReportRequest'
      responses:
        '200':
          description: 预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /alarmApi/warnResult/report:
    post:
      operationId: disposeExternalAlert
      tags: [alert-center-compatibility]
      description: 设计文档规定的外部预警处置结果入口；processTime 支持 `yyyy-MM-dd HH:mm:ss`，内部使用统一 ApiResponse 包络。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAlertDisposalRequest'
      responses:
        '200':
          description: 更新后的预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /alarmWarn/school/queryPage:
    get:
      operationId: queryExternalAlerts
      tags: [alert-center-compatibility]
      description: 设计文档规定的预警中心分页查询兼容入口。
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
        - $ref: '#/components/parameters/AlertSource'
        - $ref: '#/components/parameters/AlertStatus'
        - $ref: '#/components/parameters/AlarmEventId'
        - name: warnStatus
          in: query
          required: false
          schema:
            type: string
            enum: [UNPROCESSED, PROCESSED]
        - $ref: '#/components/parameters/DeviceName'
        - $ref: '#/components/parameters/StartDateTime'
        - $ref: '#/components/parameters/EndDateTime'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分页预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPageResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-cycles:
    post:
      operationId: startLedgerCycle
      tags: [ledger]
      description: 同一学校、食堂和周期编号重复提交相同周期定义会返回已有状态；要求集合或日期不同会返回业务错误。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerCycleRequest'
      responses:
        '200':
          description: 台账周期和当前预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-cycles/{cycleId}/records:
    post:
      operationId: completeScopedLedgerRecord
      tags: [ledger]
      description: 按学校、食堂、周期和台账编码幂等完成；重复完成已完成台账不会产生额外业务副作用。
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopedLedgerRecord'
      responses:
        '200':
          description: 完成台账后的当前预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-cycles/{cycleId}/alerts/current:
    get:
      operationId: getScopedLedgerAlert
      tags: [ledger]
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: string
        - name: schoolId
          in: query
          required: true
          schema:
            type: string
        - name: canteenId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 指定学校食堂周期的当前预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-records:
    post:
      operationId: completeLedgerRecord
      tags: [ledger]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerRecord'
      responses:
        '200':
          description: 台账完成后的预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-alerts/current:
    get:
      operationId: getCurrentLedgerAlert
      tags: [ledger]
      responses:
        '200':
          description: 当前待补台账和预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/auth/refresh-token:
    post:
      operationId: refreshToken
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated login tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Refresh session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /api/v1/auth/me:
    get:
      operationId: currentUser
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/ingredients:
    get:
      operationId: listIngredients
      tags: [catalog]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
        - name: keyword
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalPage'
        - $ref: '#/components/parameters/OperationalSize'
      responses:
        '200':
          description: Ingredient page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientPageResponse'
    post:
      operationId: createIngredient
      tags: [catalog]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientRequest'
      responses:
        '200':
          description: Ingredient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientResponse'
  /api/v1/ingredients/{ingredientId}:
    put:
      operationId: updateIngredient
      tags: [catalog]
      parameters:
        - name: ingredientId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientRequest'
      responses:
        '200':
          description: Ingredient updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientResponse'
  /api/v1/ingredients/{ingredientId}/units:
    get:
      operationId: listIngredientUnits
      tags: [catalog]
      parameters:
        - name: ingredientId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      responses:
        '200':
          description: 食材业务单位及基础单位换算
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientUnitListResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/dishes:
    get:
      operationId: listDishes
      tags: [catalog]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
        - name: keyword
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalPage'
        - $ref: '#/components/parameters/OperationalSize'
      responses:
        '200':
          description: Dish page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishPageResponse'
    post:
      operationId: createDish
      tags: [catalog]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishRequest'
      responses:
        '200':
          description: Dish created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishResponse'
  /api/v1/dishes/{dishId}:
    put:
      operationId: updateDish
      tags: [catalog]
      parameters:
        - name: dishId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishRequest'
      responses:
        '200':
          description: Dish updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DishResponse'
  /api/v1/daily-menus:
    get:
      operationId: listDailyMenus
      tags: [menu]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/OperationalPage'
        - $ref: '#/components/parameters/OperationalSize'
      responses:
        '200':
          description: Daily menu page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyMenuPageResponse'
    post:
      operationId: saveDailyMenu
      tags: [menu]
      parameters:
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyMenuRequest'
      responses:
        '200':
          description: Daily menu saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyMenuResponse'
  /api/v1/daily-menus/{menuId}/publish:
    post:
      operationId: publishDailyMenu
      tags: [menu]
      parameters:
        - name: menuId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OperationalSchoolId'
        - $ref: '#/components/parameters/OperationalCanteenId'
      responses:
        '200':
          description: Published daily menu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyMenuResponse'
