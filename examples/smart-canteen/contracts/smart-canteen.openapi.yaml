openapi: 3.0.3
info:
  title: Smart Canteen Workflow API
  version: 1.0.0
  description: 菜单审批、采购缺口、库存入库和台账预警的最小业务闭环。
servers:
  - url: http://localhost:8080
paths:
  /api/v1/menus/{menuId}/submit:
    post:
      operationId: submitMenu
      tags: [menu-approval]
      parameters:
        - $ref: '#/components/parameters/MenuId'
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      responses:
        '200':
          description: 菜单已提交审批
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/menu-approvals/{menuId}/decision:
    post:
      operationId: decideMenuApproval
      tags: [menu-approval]
      parameters:
        - $ref: '#/components/parameters/MenuId'
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: 审批结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/menus/{menuId}/recipe:
    post:
      operationId: importMenuRecipe
      tags: [recipe]
      parameters:
        - $ref: '#/components/parameters/MenuId'
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeImportRequest'
      responses:
        '200':
          description: 鑿滃崟椋熻氨瀵煎叆缁撴灉
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/generate:
    post:
      operationId: generateProcurementPlan
      tags: [procurement]
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateProcurementRequest'
      responses:
        '200':
          description: 基于已审批菜单和当前库存生成的采购缺口
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/inventory/receipts:
    post:
      operationId: receiveInventory
      tags: [inventory]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 防止入库单重复提交
          schema:
            type: string
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryReceipt'
      responses:
        '200':
          description: 入库后的基础单位库存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-cycles:
    post:
      operationId: startLedgerCycle
      tags: [ledger]
      description: 同一学校、食堂和周期编号重复提交相同周期定义会返回已有状态；要求集合或日期不同会返回业务错误。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerCycleRequest'
      responses:
        '200':
          description: 台账周期和当前预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-cycles/{cycleId}/records:
    post:
      operationId: completeScopedLedgerRecord
      tags: [ledger]
      description: 按学校、食堂、周期和台账编码幂等完成；重复完成已完成台账不会产生额外业务副作用。
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopedLedgerRecord'
      responses:
        '200':
          description: 完成台账后的当前预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-cycles/{cycleId}/alerts/current:
    get:
      operationId: getScopedLedgerAlert
      tags: [ledger]
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: string
        - name: schoolId
          in: query
          required: true
          schema:
            type: string
        - name: canteenId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 指定学校食堂周期的当前预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-records:
    post:
      operationId: completeLedgerRecord
      tags: [ledger]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerRecord'
      responses:
        '200':
          description: 台账完成后的预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-alerts/current:
    get:
      operationId: getCurrentLedgerAlert
      tags: [ledger]
      responses:
        '200':
          description: 当前待补台账和预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
components:
  parameters:
    MenuId:
      name: menuId
      in: path
      required: true
      schema:
        type: string
    SchoolId:
      name: schoolId
      in: query
      required: false
      description: 学校范围；必须与 canteenId 成对提供，省略时使用兼容默认范围。
      schema:
        type: string
    CanteenId:
      name: canteenId
      in: query
      required: false
      description: 食堂范围；必须与 schoolId 成对提供，省略时使用兼容默认范围。
      schema:
        type: string
  responses:
    BusinessError:
      description: 业务规则或参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Menu:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED]
        decisionComment:
          type: string
          nullable: true
    ApprovalDecision:
      type: object
      required: [decision, comment]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        comment:
          type: string
    GenerateProcurementRequest:
      type: object
      required: [menuId]
      properties:
        menuId:
          type: string
    RecipeImportRequest:
      type: object
      required: [requirements]
      properties:
        requirements:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeRequirement'
    RecipeRequirement:
      type: object
      required: [materialId, quantity, unit]
      properties:
        materialId:
          type: string
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
        unit:
          type: string
          enum: [kg, g, L, ml, count]
    ProcurementItem:
      type: object
      required: [materialId, requiredBaseQuantity, shortageBaseQuantity, baseUnit]
      properties:
        materialId:
          type: string
        requiredBaseQuantity:
          type: number
        shortageBaseQuantity:
          type: number
        baseUnit:
          type: string
          enum: [g, ml, count]
    ProcurementPlan:
      type: object
      required: [menuId, items]
      properties:
        menuId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProcurementItem'
    InventoryReceipt:
      type: object
      required: [materialId, quantity, unit]
      properties:
        materialId:
          type: string
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
        unit:
          type: string
          enum: [kg, g, L, ml, count]
    Receipt:
      type: object
      required: [materialId, quantityBase, baseUnit]
      properties:
        materialId:
          type: string
        quantityBase:
          type: number
        baseUnit:
          type: string
    LedgerRecord:
      type: object
      required: [ledgerCode]
      properties:
        ledgerCode:
          type: string
          enum: [PERSONNEL_MORNING_CHECK, FACILITY_DISINFECTION, FOOD_PROCESSING, SAMPLE_RETENTION, ACCOMPANYING_MEAL_EVALUATION, PURCHASE_ACCEPTANCE]
    LedgerCycleRequest:
      type: object
      required: [schoolId, canteenId, cycleId, ledgerCodes]
      properties:
        schoolId:
          type: string
        canteenId:
          type: string
        cycleId:
          type: string
        ledgerCodes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [PERSONNEL_MORNING_CHECK, FACILITY_DISINFECTION, FOOD_PROCESSING, SAMPLE_RETENTION, ACCOMPANYING_MEAL_EVALUATION, PURCHASE_ACCEPTANCE]
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
    ScopedLedgerRecord:
      type: object
      required: [schoolId, canteenId, ledgerCode]
      properties:
        schoolId:
          type: string
        canteenId:
          type: string
        ledgerCode:
          type: string
          enum: [PERSONNEL_MORNING_CHECK, FACILITY_DISINFECTION, FOOD_PROCESSING, SAMPLE_RETENTION, ACCOMPANYING_MEAL_EVALUATION, PURCHASE_ACCEPTANCE]
    LedgerAlert:
      type: object
      required: [schoolId, canteenId, cycleId, status, cleared, missingLedgerCodes]
      properties:
        schoolId:
          type: string
        canteenId:
          type: string
        cycleId:
          type: string
        status:
          type: string
          enum: [OPEN, CLEARED]
        cleared:
          type: boolean
        missingLedgerCodes:
          type: array
          items:
            type: string
    MenuResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Menu'
    ProcurementPlanResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/ProcurementPlan'
    RecipeResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Recipe'
    Recipe:
      type: object
      required: [menuId, requirements]
      properties:
        menuId:
          type: string
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/RecipeRequirement'
    ReceiptResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Receipt'
    LedgerAlertResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/LedgerAlert'
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
