openapi: 3.0.3
info:
  title: Smart Canteen Workflow API
  version: 1.0.0
  description: 菜单审批、采购缺口、库存入库和台账预警的最小业务闭环。
servers:
  - url: http://localhost:8080
paths:
  /api/v1/menus/{menuId}/submit:
    post:
      operationId: submitMenu
      tags: [menu-approval]
      parameters:
        - $ref: '#/components/parameters/MenuId'
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      responses:
        '200':
          description: 菜单已提交审批
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/menu-approvals/{menuId}/decision:
    post:
      operationId: decideMenuApproval
      tags: [menu-approval]
      parameters:
        - $ref: '#/components/parameters/MenuId'
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: 审批结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/menus/{menuId}/recipe:
    post:
      operationId: importMenuRecipe
      tags: [recipe]
      parameters:
        - $ref: '#/components/parameters/MenuId'
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeImportRequest'
      responses:
        '200':
          description: 鑿滃崟椋熻氨瀵煎叆缁撴灉
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/procurement-plans/generate:
    post:
      operationId: generateProcurementPlan
      tags: [procurement]
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateProcurementRequest'
      responses:
        '200':
          description: 基于已审批菜单和当前库存生成的采购缺口
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementPlanResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/inventory/receipts:
    post:
      operationId: receiveInventory
      tags: [inventory]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 防止入库单重复提交
          schema:
            type: string
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryReceipt'
      responses:
        '200':
          description: 入库后的基础单位库存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/alerts:
    post:
      operationId: reportAlert
      tags: [alert-center]
      description: 接收区县平台、明厨亮灶或晨检仪归一化后的预警；相同 source 与 thirdWarnId 重复提交返回原记录，内容变化返回业务错误。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertReportRequest'
      responses:
        '200':
          description: 预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
    get:
      operationId: queryAlerts
      tags: [alert-center]
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
        - $ref: '#/components/parameters/AlertSource'
        - $ref: '#/components/parameters/AlertStatus'
        - $ref: '#/components/parameters/AlarmEventId'
        - $ref: '#/components/parameters/DeviceName'
        - $ref: '#/components/parameters/StartDateTime'
        - $ref: '#/components/parameters/EndDateTime'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分页预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPageResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/alerts/{warnId}/disposal:
    post:
      operationId: disposeAlert
      tags: [alert-center]
      description: 处置预警；同一记录重复提交相同处置结果是幂等的，已处置记录不能被不同结果覆盖。
      parameters:
        - $ref: '#/components/parameters/WarnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertDisposalRequest'
      responses:
        '200':
          description: 更新后的预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /alarmApi/warn/report:
    post:
      operationId: reportExternalAlert
      tags: [alert-center-compatibility]
      description: 设计文档规定的外部预警接收兼容入口；接受本地时间格式并允许非 AI 事件缺省 thirdWarnId，内部归一化后使用统一 ApiResponse 包络。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAlertReportRequest'
      responses:
        '200':
          description: 预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /alarmApi/warnResult/report:
    post:
      operationId: disposeExternalAlert
      tags: [alert-center-compatibility]
      description: 设计文档规定的外部预警处置结果入口；processTime 支持 `yyyy-MM-dd HH:mm:ss`，内部使用统一 ApiResponse 包络。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAlertDisposalRequest'
      responses:
        '200':
          description: 更新后的预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /alarmWarn/school/queryPage:
    get:
      operationId: queryExternalAlerts
      tags: [alert-center-compatibility]
      description: 设计文档规定的预警中心分页查询兼容入口。
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/CanteenId'
        - $ref: '#/components/parameters/AlertSource'
        - $ref: '#/components/parameters/AlertStatus'
        - $ref: '#/components/parameters/AlarmEventId'
        - name: warnStatus
          in: query
          required: false
          schema:
            type: string
            enum: [UNPROCESSED, PROCESSED]
        - $ref: '#/components/parameters/DeviceName'
        - $ref: '#/components/parameters/StartDateTime'
        - $ref: '#/components/parameters/EndDateTime'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分页预警记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPageResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-cycles:
    post:
      operationId: startLedgerCycle
      tags: [ledger]
      description: 同一学校、食堂和周期编号重复提交相同周期定义会返回已有状态；要求集合或日期不同会返回业务错误。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerCycleRequest'
      responses:
        '200':
          description: 台账周期和当前预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-cycles/{cycleId}/records:
    post:
      operationId: completeScopedLedgerRecord
      tags: [ledger]
      description: 按学校、食堂、周期和台账编码幂等完成；重复完成已完成台账不会产生额外业务副作用。
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopedLedgerRecord'
      responses:
        '200':
          description: 完成台账后的当前预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-cycles/{cycleId}/alerts/current:
    get:
      operationId: getScopedLedgerAlert
      tags: [ledger]
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: string
        - name: schoolId
          in: query
          required: true
          schema:
            type: string
        - name: canteenId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 指定学校食堂周期的当前预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-records:
    post:
      operationId: completeLedgerRecord
      tags: [ledger]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerRecord'
      responses:
        '200':
          description: 台账完成后的预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /api/v1/ledger-alerts/current:
    get:
      operationId: getCurrentLedgerAlert
      tags: [ledger]
      responses:
        '200':
          description: 当前待补台账和预警状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAlertResponse'
components:
  parameters:
    MenuId:
      name: menuId
      in: path
      required: true
      schema:
        type: string
    SchoolId:
      name: schoolId
      in: query
      required: false
      description: 学校范围；必须与 canteenId 成对提供，省略时使用兼容默认范围。
      schema:
        type: string
    CanteenId:
      name: canteenId
      in: query
      required: false
      description: 食堂范围；必须与 schoolId 成对提供，省略时使用兼容默认范围。
      schema:
        type: string
    AlertSource:
      name: source
      in: query
      required: false
      schema:
        type: string
        enum: [DISTRICT_PLATFORM, BRIGHT_KITCHEN, MORNING_INSPECTION, LEDGER]
    AlertStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [UNPROCESSED, PROCESSED]
    AlarmEventId:
      name: alarmEventId
      in: query
      required: false
      description: 警情类型 ID，例如未戴帽子、手温异常或食材价格预警。
      schema:
        type: string
    DeviceName:
      name: deviceName
      in: query
      required: false
      schema:
        type: string
    StartDateTime:
      name: startDate
      in: query
      required: false
      schema:
        type: string
        format: date-time
    EndDateTime:
      name: endDate
      in: query
      required: false
      schema:
        type: string
        format: date-time
    PageNum:
      name: pageNum
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WarnId:
      name: warnId
      in: path
      required: true
      schema:
        type: string
  responses:
    BusinessError:
      description: 业务规则或参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Menu:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED]
        decisionComment:
          type: string
          nullable: true
    ApprovalDecision:
      type: object
      required: [decision, comment]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        comment:
          type: string
    GenerateProcurementRequest:
      type: object
      required: [menuId]
      properties:
        menuId:
          type: string
    RecipeImportRequest:
      type: object
      required: [requirements]
      properties:
        requirements:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeRequirement'
    RecipeRequirement:
      type: object
      required: [materialId, quantity, unit]
      properties:
        materialId:
          type: string
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
        unit:
          type: string
          enum: [kg, g, L, ml, count]
    ProcurementItem:
      type: object
      required: [materialId, requiredBaseQuantity, shortageBaseQuantity, baseUnit]
      properties:
        materialId:
          type: string
        requiredBaseQuantity:
          type: number
        shortageBaseQuantity:
          type: number
        baseUnit:
          type: string
          enum: [g, ml, count]
    ProcurementPlan:
      type: object
      required: [menuId, items]
      properties:
        menuId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProcurementItem'
    InventoryReceipt:
      type: object
      required: [materialId, quantity, unit]
      properties:
        materialId:
          type: string
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
        unit:
          type: string
          enum: [kg, g, L, ml, count]
    AlertReportRequest:
      type: object
      required: [thirdWarnId, schoolId, warnHappenTime, alarmEventId, warnContent]
      properties:
        source:
          type: string
          enum: [DISTRICT_PLATFORM, BRIGHT_KITCHEN, MORNING_INSPECTION, LEDGER]
          default: BRIGHT_KITCHEN
        thirdWarnId:
          type: string
        schoolId:
          type: string
        schoolName:
          type: string
          nullable: true
        areaCode:
          type: string
          nullable: true
        deviceId:
          type: string
          nullable: true
        deviceName:
          type: string
          nullable: true
        canteenId:
          type: string
          nullable: true
        warnHappenTime:
          type: string
          format: date-time
        alarmEventId:
          type: string
        warnFullPic:
          type: string
          nullable: true
        warnContent:
          type: string
    ExternalAlertReportRequest:
      type: object
      required: [schoolId, warnHappenTime, alarmEventId]
      description: 设计文档外部入口的归一化输入；未提供 thirdWarnId 时由 source、学校、事件、时间和内容生成稳定 ID。
      properties:
        source:
          type: string
          enum: [DISTRICT_PLATFORM, BRIGHT_KITCHEN, MORNING_INSPECTION, LEDGER]
        thirdWarnId:
          type: string
          nullable: true
        schoolId:
          type: string
        schoolName:
          type: string
          nullable: true
        areaCode:
          type: string
          nullable: true
        deviceId:
          type: string
          nullable: true
        deviceName:
          type: string
          nullable: true
        canteenId:
          type: string
          nullable: true
        warnHappenTime:
          type: string
          description: ISO-8601 或 yyyy-MM-dd HH:mm:ss
        alarmEventId:
          type: string
        warnFullPic:
          type: string
          nullable: true
        warnContent:
          type: string
          nullable: true
    AlertDisposalRequest:
      type: object
      required: [processStatus]
      properties:
        source:
          type: string
          enum: [DISTRICT_PLATFORM, BRIGHT_KITCHEN, MORNING_INSPECTION, LEDGER]
        thirdWarnId:
          type: string
          nullable: true
        processStatus:
          type: integer
          enum: [0, 1]
        processTime:
          type: string
          format: date-time
          nullable: true
        processUser:
          type: string
          nullable: true
        processContent:
          type: string
          nullable: true
        processFile:
          type: string
          nullable: true
    ExternalAlertDisposalRequest:
      type: object
      required: [processStatus]
      properties:
        source:
          type: string
          enum: [DISTRICT_PLATFORM, BRIGHT_KITCHEN, MORNING_INSPECTION, LEDGER]
        thirdWarnId:
          type: string
          nullable: true
        warnId:
          type: string
          nullable: true
        processStatus:
          type: integer
          enum: [0, 1]
        processTime:
          type: string
          nullable: true
          description: ISO-8601 或 yyyy-MM-dd HH:mm:ss
        processUser:
          type: string
          nullable: true
        processContent:
          type: string
          nullable: true
        processFile:
          type: string
          nullable: true
    AlertRecord:
      type: object
      required: [warnId, source, thirdWarnId, schoolId, warnHappenTime, alarmEventId, warnContent, status, processStatus, createdAt]
      properties:
        warnId:
          type: string
        source:
          type: string
          enum: [DISTRICT_PLATFORM, BRIGHT_KITCHEN, MORNING_INSPECTION, LEDGER]
        thirdWarnId:
          type: string
        schoolId:
          type: string
        schoolName:
          type: string
          nullable: true
        areaCode:
          type: string
          nullable: true
        deviceId:
          type: string
          nullable: true
        deviceName:
          type: string
          nullable: true
        canteenId:
          type: string
          nullable: true
        warnHappenTime:
          type: string
          format: date-time
        alarmEventId:
          type: string
        warnFullPic:
          type: string
          nullable: true
        warnContent:
          type: string
        status:
          type: string
          enum: [UNPROCESSED, PROCESSED]
        processStatus:
          type: integer
          enum: [0, 1]
        createdAt:
          type: string
          format: date-time
        processTime:
          type: string
          format: date-time
          nullable: true
        processUser:
          type: string
          nullable: true
        processContent:
          type: string
          nullable: true
        processFile:
          type: string
          nullable: true
    AlertPage:
      type: object
      required: [records, pageNum, pageSize, total]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/AlertRecord'
        pageNum:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    AlertResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/AlertRecord'
    AlertPageResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/AlertPage'
    Receipt:
      type: object
      required: [materialId, quantityBase, baseUnit]
      properties:
        materialId:
          type: string
        quantityBase:
          type: number
        baseUnit:
          type: string
    LedgerRecord:
      type: object
      required: [ledgerCode]
      properties:
        ledgerCode:
          type: string
          enum: [PERSONNEL_MORNING_CHECK, FACILITY_DISINFECTION, FOOD_PROCESSING, SAMPLE_RETENTION, ACCOMPANYING_MEAL_EVALUATION, PURCHASE_ACCEPTANCE]
    LedgerCycleRequest:
      type: object
      required: [schoolId, canteenId, cycleId, ledgerCodes]
      properties:
        schoolId:
          type: string
        canteenId:
          type: string
        cycleId:
          type: string
        ledgerCodes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [PERSONNEL_MORNING_CHECK, FACILITY_DISINFECTION, FOOD_PROCESSING, SAMPLE_RETENTION, ACCOMPANYING_MEAL_EVALUATION, PURCHASE_ACCEPTANCE]
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
    ScopedLedgerRecord:
      type: object
      required: [schoolId, canteenId, ledgerCode]
      properties:
        schoolId:
          type: string
        canteenId:
          type: string
        ledgerCode:
          type: string
          enum: [PERSONNEL_MORNING_CHECK, FACILITY_DISINFECTION, FOOD_PROCESSING, SAMPLE_RETENTION, ACCOMPANYING_MEAL_EVALUATION, PURCHASE_ACCEPTANCE]
    LedgerAlert:
      type: object
      required: [schoolId, canteenId, cycleId, status, cleared, missingLedgerCodes]
      properties:
        schoolId:
          type: string
        canteenId:
          type: string
        cycleId:
          type: string
        status:
          type: string
          enum: [OPEN, CLEARED]
        cleared:
          type: boolean
        missingLedgerCodes:
          type: array
          items:
            type: string
    MenuResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Menu'
    ProcurementPlanResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/ProcurementPlan'
    RecipeResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Recipe'
    Recipe:
      type: object
      required: [menuId, requirements]
      properties:
        menuId:
          type: string
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/RecipeRequirement'
    ReceiptResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Receipt'
    LedgerAlertResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
