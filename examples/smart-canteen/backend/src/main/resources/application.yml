spring:
  application:
    name: smart-canteen-backend
  datasource:
    url: ${SMART_CANTEEN_DB_URL:jdbc:mysql://localhost:3306/smart_canteen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SMART_CANTEEN_DB_USERNAME:smart_canteen}
    password: ${SMART_CANTEEN_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${SMART_CANTEEN_DB_POOL_SIZE:10}
      connection-timeout: 10000
  flyway:
    enabled: true
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
