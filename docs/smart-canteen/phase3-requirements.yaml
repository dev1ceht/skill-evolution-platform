schema_version: "1.0"
project: smart-canteen-backend
phase: phase-3-canteen-scope
source_documents:
  - id: overview-design
    path: "智慧食堂项目概要设计文档.pdf"
    scope: "模块化单体、数据权限和接口分层"
  - id: phase2-design
    path: "智慧食堂二期-系统设计.pdf"
    scope: "基础单位、采购入库、食谱和数据权限"
requirements:
  - id: DATA-002
    category: persistence
    source:
      document: phase2-design
      section: "3.2.5 基础单位统一设计"
    statement: "菜单、食谱、库存和入库记录必须按学校与食堂范围隔离，并以基础单位保存库存数量。"
    acceptance:
      - "菜单、食谱、库存和入库幂等键使用 school_id + canteen_id 复合身份。"
      - "Flyway 从 V2 迁移到 V3，并把既有默认数据迁移到 SCHOOL-001/CANTEEN-001。"
      - "相同业务编号在不同食堂不会互相覆盖或复用幂等结果。"
    status: approved
  - id: ARCH-004
    category: architecture
    source:
      document: overview-design
      section: "2.3 逻辑架构"
    statement: "业务模块通过显式食堂范围接口访问数据，范围规则不泄漏到 HTTP 或 JDBC 细节。"
    acceptance:
      - "CanteenScope 是菜单、采购和库存模块的公开范围对象。"
      - "JDBC 适配器负责复合键查询，领域模块不依赖 SQL。"
    status: approved
  - id: API-003
    category: api
    source:
      document: overview-design
      section: "5.1 接口设计原则"
    statement: "范围扩展保持 REST v1 路径、响应 envelope 和旧调用行为兼容。"
    acceptance:
      - "菜单、采购和库存接口接受可选 schoolId/canteenId 查询参数。"
      - "省略范围时继续使用既有 SCHOOL-001/CANTEEN-001 兼容范围。"
      - "OpenAPI、API IR、生成客户端和契约测试同步更新。"
    status: approved
  - id: TEST-003
    category: verification
    source:
      document: overview-design
      section: "6.7 部署验证"
    statement: "范围隔离必须通过模块、HTTP 和持久化迁移验证，并保留可追溯证据。"
    acceptance:
      - "模块测试覆盖同编号菜单、采购数据和幂等键的跨食堂隔离。"
      - "HTTP 测试覆盖显式查询范围，旧 HTTP 回归继续通过。"
      - "H2 Flyway V3 和完整 Maven 测试通过；MySQL 仍按环境门控记录。"
    status: approved
