schema_version: "1.0"
phase: phase-0-requirements-and-domain-baseline
base_path: /api/v1
scope:
  default: schoolId + canteenId
  exceptions:
    - system authentication
    - regulator aggregate queries with explicit region authorization
    - public traceability lookup with a signed/public code policy

resources:
  auth:
    existing:
      - POST /auth/login
      - POST /auth/refresh-token
      - POST /auth/logout
      - GET /auth/me
    target:
      - POST /wxmp/auth/login

  organization:
    target:
      - GET /schools
      - POST /schools
      - GET /canteens
      - POST /canteens
      - GET /users
      - POST /users
      - PUT /users/{userId}
      - POST /users/{userId}/status
      - GET /roles
      - PUT /roles/{roleId}/permissions

  recipe:
    existing:
      - GET /ingredients
      - POST /ingredients
      - PUT /ingredients/{ingredientId}
      - GET /dishes
      - POST /dishes
      - PUT /dishes/{dishId}
      - GET /daily-menus
      - POST /daily-menus
      - POST /daily-menus/{menuId}/publish
    target:
      - POST /menus/{menuId}/submit
      - POST /menus/{menuId}/approve
      - POST /menus/{menuId}/reject
      - POST /menus/{menuId}/copy
      - GET /menus/{menuId}/nutrition
      - POST /dishes/import
      - POST /recipes/import

  procurement:
    existing:
      - GET /suppliers
      - POST /suppliers
      - GET /purchase-orders
      - POST /purchase-orders
      - POST /purchase-orders/{orderId}/status
      - POST /purchase-orders/{orderId}/receive
      - GET /inventory
      - POST /inventory/stock-outs
    target:
      - POST /procurement-plans/generate
      - PUT /procurement-plans/{planId}
      - POST /procurement-plans/{planId}/confirm
      - POST /purchase-orders/{orderId}/ship
      - POST /purchase-orders/{orderId}/deliver
      - POST /purchase-orders/{orderId}/inspect
      - POST /purchase-orders/{orderId}/stock-in
      - POST /inventory/counts
      - POST /inventory/adjustments

  ledger:
    existing:
      - POST /ledger-cycles
      - POST /ledger-cycles/{cycleId}/records
      - GET /ledger-cycles/{cycleId}/alerts/current
      - POST /ledger/records
      - GET /ledger/records
      - GET /ledger/stats
    target:
      - GET /ledger-types
      - POST /ledger-types
      - PUT /ledger-configurations/{id}
      - POST /ledger-records/{recordId}/attachments
      - GET /ledger/exports

  system_management:
    target:
      - GET /announcements
      - POST /announcements
      - POST /announcements/{announcementId}/submit
      - POST /announcements/{announcementId}/publish
      - POST /announcements/{announcementId}/withdraw
      - GET /canteen-styles
      - POST /canteen-styles
      - POST /canteen-styles/{styleId}/submit
      - POST /canteen-styles/{styleId}/decision
      - GET /meal-suspensions
      - POST /meal-suspensions
      - POST /meal-suspensions/{suspensionId}/decision
      - GET /complaints
      - POST /complaints
      - POST /complaints/{complaintId}/process
      - POST /complaints/{complaintId}/close
      - GET /knowledge
      - POST /knowledge
      - POST /knowledge/{knowledgeId}/publish

  settlement_and_cost:
    target:
      - GET /settlements
      - POST /settlements/generate
      - POST /settlements/{settlementId}/decision
      - GET /cost-records
      - POST /cost-records
      - GET /cost-accounting
      - POST /cost-accounting/{accountingId}/publish

  safety_and_alerts:
    target:
      - GET /licenses
      - POST /licenses
      - GET /health-certificates
      - POST /health-certificates
      - GET /alert-rules
      - PUT /alert-rules/{id}
      - GET /alerts
      - POST /alerts/{warnId}/disposal

  statistics:
    existing:
      - GET /dashboard/summary
      - GET /dashboard/risk
      - GET /traceability/{traceCode}
    target:
      - GET /statistics/purchases
      - GET /statistics/inventory
      - GET /statistics/ledger
      - GET /statistics/risk
      - GET /datacenter/sync-status

  city_data:
    target:
      - POST /datacenter/auth/token
      - POST /datacenter/sync/full
      - POST /datacenter/sync/incremental
      - GET /datacenter/sync-runs/{runId}

  external_integrations:
    target:
      - GET /integration-connections
      - POST /integration-connections/{connectionId}/test
      - GET /devices
      - GET /device-sync-runs

compatibility:
  rule: "旧路径可以保留兼容，但必须调用规范应用服务，不能形成第二套业务规则。"
  response: "统一使用 code/message/data；厂商兼容路径只做协议转换。"
  idempotency: "订单、验收、出库、外部预警和批量导入必须声明幂等规则。"
  deprecation: "规范接口上线后，旧接口至少保留一个完整发布周期并输出弃用日志。"
