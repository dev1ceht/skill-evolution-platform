schema_version: "1.0"
project: smart-canteen
phase: phase-2-unified-recipe-procurement-loop
requirements:
  - id: RECIPE-001
    source: "智慧食堂项目概要设计文档.pdf 3.4.2, 3.4.4"
    statement: "已发布食谱按日期、餐次、菜品和预计份数计算食材需求，配方量先换算为食材基础单位。"
    acceptance:
      - "草稿日食谱不参与计划生成。"
      - "同一食材跨菜品和餐次聚合为一条计划明细。"
      - "库存和未入库订单量从需求中扣除。"
  - id: PLAN-001
    source: "智慧食堂项目概要设计文档.pdf 3.6.2, 3.6.4"
    statement: "采购计划是从食谱自动生成、可人工调整并确认的中间业务对象。"
    acceptance:
      - "计划持久化来源食谱、计算快照和可采购数量。"
      - "计划支持草稿、确认、转单和取消状态。"
      - "人工调整使用版本号防止覆盖他人修改。"
  - id: ORDER-001
    source: "智慧食堂项目概要设计文档.pdf 2.4.4, 3.6.4"
    statement: "确认采购计划可以创建线上或线下采购订单，并保留计划到订单的关联。"
    acceptance:
      - "仅 CONFIRMED 计划允许转单。"
      - "订单明细不得超过计划可采购量。"
      - "同一转单请求可安全重试且不会产生第二个订单。"
  - id: RECEIPT-001
    source: "智慧食堂项目概要设计文档.pdf 2.4.4, 3.6.2; 智慧食堂二期-系统设计.pdf 3.2.5"
    statement: "订单确认后才能验收；验收按实际数量、价格、批次和日期入库，并按基础单位更新库存。"
    acceptance:
      - "DRAFT/SUBMITTED 订单不能验收，CANCELLED 订单不能验收。"
      - "支持部分验收，累计验收量不超过订单量。"
      - "验收生成 receipt、inventory batch、traceability record，并且重试不重复入库。"
      - "食材级业务单位按换算关系转为基础单位。"
  - id: API-201
    source: "两份设计文档接口设计原则"
    statement: "新增闭环接口保持 v1 路径、{code,message,data} envelope、范围隔离和幂等请求头。"
    acceptance:
      - "旧兼容接口继续通过。"
      - "新增接口在 OpenAPI 和前端 API 适配器中有对应定义。"
  - id: TEST-201
    source: "智慧食堂项目概要设计文档.pdf 7.3.3"
    statement: "阶段2必须验证核心数据流转和失败边界。"
    acceptance:
      - "需求聚合、计划状态、转单、部分验收、重复验收和范围隔离有测试。"
      - "后端、前端构建和相关全量测试通过。"
