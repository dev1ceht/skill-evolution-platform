schema_version: "1.0"
project: smart-canteen-backend
phase: phase-5-operational-core
source_documents:
  - id: overview-design
    path: "智慧食堂项目概要设计文档.pdf"
    sha256: "200A5F09EAB0D1D4ADBA11396E3925E41DADF54E9A9ECA84BA01FBA522F12473"
    scope: "认证授权、基础资料、食谱、台账、采购、库存、统计与溯源"
  - id: phase2-design
    path: "智慧食堂二期-系统设计.pdf"
    sha256: "6209C740D106924F4FB17B546407E82CFB753075EDB51636CA61726161692376"
    scope: "预警中心、采购、食谱、台账预警和单位约束"

requirements:
  - id: AUTH-001
    category: security
    source:
      document: overview-design
      section: "5.4.1 认证授权接口; 6.3.1 身份认证"
    statement: "系统提供账号密码登录、访问令牌刷新、注销和当前用户查询，密码不可明文存储。"
    acceptance:
      - "登录成功返回短期 access token、refresh token 和用户角色/组织范围。"
      - "密码使用带随机盐的 PBKDF2 哈希校验，数据库不保存明文密码。"
      - "refresh token 可轮换，注销后旧 refresh token 不能继续刷新。"
    status: approved

  - id: CATALOG-001
    category: recipe
    source:
      document: overview-design
      section: "3.4 食谱管理模块; 4.3 食材信息表、菜品信息表"
    statement: "学校食堂可以维护带营养信息和基础单位的食材，以及由食材配方组成的菜品。"
    acceptance:
      - "食材、菜品和配方按 schoolId + canteenId 隔离。"
      - "食材基础单位、营养字段、配方数量必须经过服务端校验。"
      - "同一食堂内食材名称和菜品名称不能重复。"
    status: approved

  - id: MENU-001
    category: menu
    source:
      document: overview-design
      section: "3.4.4 食谱编辑流程; 5.4.2 食谱管理接口"
    statement: "管理员可以按日期和餐次编辑、查询并发布日食谱，日食谱引用菜品库而不是重复录入菜品。"
    acceptance:
      - "同一学校、食堂、日期和餐次最多存在一份日食谱。"
      - "草稿可覆盖保存，已发布食谱不能被静默修改。"
      - "发布时引用的菜品必须存在且处于启用状态。"
    status: approved

  - id: LEDGER-004
    category: ledger
    source:
      document: overview-design
      section: "3.5 台账管理模块; 5.4.3 台账管理接口"
    statement: "系统保存带内容和照片引用的台账记录，并支持按食堂、类型、日期和状态查询及统计。"
    acceptance:
      - "记录写入必须关联已有周期和已配置台账编码。"
      - "同一周期和台账编码重复提交返回已有记录，不重复产生副作用。"
      - "列表和统计结果只读取请求范围内的数据。"
    status: approved

  - id: PROCUREMENT-001
    category: procurement
    source:
      document: overview-design
      section: "3.6 采购管理模块; 5.4.4 采购管理接口"
    statement: "食堂可以维护供应商、创建采购订单、确认订单并完成带批次的验收入库。"
    acceptance:
      - "订单及明细按学校和食堂隔离，金额由明细数量和单价服务端计算。"
      - "订单状态只能按草稿、已提交、已确认、已收货、已取消的规则迁移。"
      - "收货使用幂等键，重复收货不重复增加库存。"
    status: approved

  - id: INVENTORY-001
    category: inventory
    source:
      document: overview-design
      section: "3.6.2 库存管理; 3.6.4 库存管理流程"
    statement: "入库按批次增加库存，库存可查询预警状态，并支持校验库存余额的出库。"
    acceptance:
      - "库存使用食材基础单位保存，入库和出库统一执行单位换算。"
      - "库存不足或单位不兼容的出库被拒绝且事务回滚。"
      - "库存低于阈值时返回 warning=true。"
    status: approved

  - id: DASHBOARD-001
    category: statistics
    source:
      document: overview-design
      section: "3.1 首页模块; 3.7 采购统计模块; 3.8 综合统计模块"
    statement: "首页提供按食堂范围聚合的日食谱、采购订单、库存、台账和预警摘要，并可查询一条食品溯源链路。"
    acceptance:
      - "摘要由持久化业务数据实时计算，不使用前端硬编码数字。"
      - "风险评分明确列出影响因素，不能把缺少外部数据伪装成已接通。"
      - "溯源查询返回批次、供应商、入库和食材信息。"
    status: approved

  - id: EXTERNAL-001
    category: integration
    source:
      document: phase2-design
      section: "3.2.1 明厨亮灶; 3.2.2 单点登录; 3.2.6 晨检仪"
    statement: "第三方平台、设备和通知系统通过适配端口接入；无真实厂商合同和凭据时只交付可替换端口及归一化数据边界。"
    acceptance:
      - "现有预警中心继续接收归一化事件并持久化处理状态。"
      - "外部网络客户端不进入领域对象，不宣称已连接厂商系统。"
      - "适配器缺少凭据时返回可诊断的配置错误。"
    status: approved
