  - id: "smart-canteen.menu-validation"
    version: "1.0.0"
    trigger:
      - "校验菜单是否可以提交审批"
    risk_level: "low"
    approval: "not-required"
    permissions: ["MENU_VALIDATE"]
    scope: "schoolId + canteenId"
    preconditions:
      - "菜单版本与请求一致"
      - "菜品和配方已存在且处于可用状态"
    idempotency: "只读校验可安全重放"
    timeout:
      mode: "request-bound"
      enforced: true
    steps: ["load-menu", "validate-dishes", "return-plan-input"]
    rollback: "not-applicable"
    requirements: ["MENU-001"]
    references: ["skills/smart-canteen-sop/references/menu-approval.md"]
    implementation:
      modules:
        - "backend/src/main/java/com/example/smartcanteen/application/DailyMenuService.java"
        - "backend/src/main/java/com/example/smartcanteen/agent/infrastructure/MenuToolExecutor.java"
      apis: ["contracts/smart-canteen.openapi.yaml"]
      migrations:
        - "backend/src/main/resources/db/migration/V5__create_operational_core.sql"
        - "backend/src/main/resources/db/migration/V15__add_menu_permissions.sql"
      tests:
        - "backend/src/test/java/com/example/smartcanteen/application/DailyMenuApprovalModuleTest.java"
      verification: ["docs/smart-canteen/agent-runtime-phase4-6-verification.json"]
    adapters:
      - name: "JdbcOperationalStore"
        status: "implemented"
    runtime:
      intents: ["menu.validate-for-submit"]
      input_schema: "#/components/schemas/MenuPublishIntent"
      output_schema: "#/components/schemas/DailyMenu"
      tools: ["menu.validate-for-submit"]
      tool_by_intent:
        menu.validate-for-submit: "menu.validate-for-submit"
      side_effect: "read"
      run_confirmation: "not-required"
      domain_approval: "not-applicable"
      activation: "active"
      deadline_ms: 3000
      retry_policy: "read-only-bounded"
      evidence: "required"
    evidence: ["docs/smart-canteen/agent-runtime-phase4-6-traceability.md"]
    status: "implemented"

  - id: "smart-canteen.menu-approval"
    version: "1.0.0"
    trigger:
      - "创建或发布日食谱"
      - "提交菜单审批"
    risk_level: "medium"
    approval: "required-before-publish"
    permissions: ["MENU_SUBMIT", "MENU_APPROVE", "MENU_PUBLISH"]
    scope: "schoolId + canteenId"
    preconditions:
      - "菜品和配方已存在且处于可用状态"
      - "同一范围、日期和餐次不存在第二份有效食谱"
    idempotency: "同一范围、日期和餐次的草稿覆盖保存；发布后拒绝修改"
    timeout:
      mode: "request-bound"
      enforced: false
    steps: ["draft", "submit", "approve-or-reject", "publish"]
    rollback: "发布前允许修订；发布后通过新版本或重新审批变更"
    requirements: ["MENU-001"]
    references: ["skills/smart-canteen-sop/references/menu-approval.md"]
    implementation:
