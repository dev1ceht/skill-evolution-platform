schema_version: "1.0"
registry: "smart-canteen-sop"
registry_version: "1.0.0"
skill: "smart-canteen-sop"
defaults:
  scope: "schoolId + canteenId"
  evidence_required: true
  external_integration_rule: "port-only until vendor contract, credentials, and network policy are verified"
sops:
