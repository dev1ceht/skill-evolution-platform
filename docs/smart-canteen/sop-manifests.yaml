    version: "1.0.0"
    trigger:
      - "查询日菜单"
      - "查看今天的食谱"
    risk_level: "low"
    approval: "not-required"
    permissions: ["MENU_READ"]
    scope: "schoolId + canteenId"
    preconditions:
      - "菜单 ID 属于当前学校和食堂范围"
    idempotency: "只读查询可安全重放"
    timeout:
      mode: "request-bound"
      enforced: true
    steps: ["load-menu", "return-menu-snapshot"]
    rollback: "not-applicable"
    requirements: ["MENU-001"]
    references: ["skills/smart-canteen-sop/references/menu-approval.md"]
