schema_version: "1.0"
project: smart-canteen
phase: phase-0-requirements-and-domain-baseline
source_documents:
  - id: overview-design
    path: "智慧食堂项目概要设计文档.pdf"
    sha256: "200A5F09EAB0D1D4ADBA11396E3925E41DADF54E9A9ECA84BA01FBA522F12473"
  - id: phase2-design
    path: "智慧食堂二期-系统设计.pdf"
    sha256: "6209C740D106924F4FB17B546407E82CFB753075EDB51636CA61726161692376"

requirements:
  - id: BASELINE-001
    priority: P0
    category: architecture
    statement: "后续业务统一使用学校、食堂和角色授权范围，运营数据不得跨食堂混用。"
    source:
      - document: overview-design
        section: "2.3 逻辑架构; 5.6.2 授权控制"
      - document: phase2-design
        section: "3.2.5 基础单位统一; 3.2.19 供应商评价"
    acceptance:
      - "所有菜单、采购、库存、台账、预警和溯源聚合都带 schoolId + canteenId。"
      - "监管查询必须显式使用区域授权，不得通过普通食堂接口绕过范围。"

  - id: BASELINE-002
    priority: P0
    category: architecture
    statement: "日食谱、采购计划、采购订单、验收入库、库存批次、出库和溯源组成唯一核心写链路。"
    source:
      - document: overview-design
        section: "3.4 食谱; 3.6 采购; 3.8 食品溯源"
      - document: phase2-design
        section: "3.2.13 采购管理; 3.2.14 食品安全溯源码"
    acceptance:
      - "已审批日食谱可以生成采购计划。"
      - "验收入库可以形成库存批次，并可被出库和溯源码查询引用。"
      - "后续新功能不再新增旧 menus/recipe_requirements 写入。"

  - id: IAM-001
    priority: P0
    category: identity
    statement: "系统支持子账号、角色、权限、状态和操作审计。"
    source:
      - document: overview-design
        section: "3.2 系统管理; 4.3 用户/角色/权限表"
    acceptance:
      - "管理员可以创建、停用和授权子账号。"
      - "用户只能访问授权学校、食堂或监管区域。"
      - "关键写操作记录操作人、时间、范围和结果。"

  - id: RECIPE-001
    priority: P0
    category: recipe
    statement: "食材、营养、菜品、配方和人群用量可以维护，并支持统一单位。"
    source:
      - document: overview-design
        section: "3.4 食谱管理; 4.3 食材/菜品/配方表"
      - document: phase2-design
        section: "3.2.5 基础单位统一"
    acceptance:
      - "菜品配方只引用存在且启用的食材。"
      - "基础单位和业务单位转换可追溯。"
      - "营养分析可以按食谱和就餐对象计算。"

  - id: MENU-APPROVAL-001
    priority: P0
    category: menu
    statement: "日食谱按日期和餐次编辑，带量食谱经审批后才能公示。"
    source:
      - document: overview-design
        section: "3.4.4 食谱编辑流程"
      - document: phase2-design
        section: "3.2.16 食谱管理"
    acceptance:
      - "同一食堂同一日期同一餐次只能有一份有效食谱。"
      - "草稿可修改，已发布食谱不可静默修改。"
      - "审批驳回必须保留原因并允许重新提交。"

  - id: PROCUREMENT-PLAN-001
    priority: P0
    category: procurement
    statement: "系统根据已审批食谱、库存和未入库订单生成可调整采购计划。"
    source:
      - document: overview-design
        section: "3.6.2 采购计划; 3.6.4 采购计划生成流程"
    acceptance:
      - "采购计划记录计算输入的食谱版本和计算时间。"
      - "管理员调整后才能确认生成订单。"
      - "重复生成不会重复产生未确认订单。"

  - id: PROCUREMENT-LIFECYCLE-001
    priority: P0
    category: procurement
    statement: "线上和线下采购覆盖下单、确认、发货、送达、验收、入库和取消。"
    source:
      - document: overview-design
        section: "3.6 采购管理"
      - document: phase2-design
        section: "3.2.13 采购管理"
    acceptance:
      - "订单状态只能按允许的状态机迁移。"
      - "订单金额由服务端根据明细计算。"
      - "验收数量、批次、日期、票证和图片形成持久化记录。"

  - id: INVENTORY-TRACE-001
    priority: P0
    category: inventory
    statement: "库存按基础单位和批次管理，出库扣减库存并形成完整溯源链。"
    source:
      - document: overview-design
        section: "3.6.2 库存管理; 3.8.2 食品溯源信息"
      - document: phase2-design
        section: "3.2.14 食品安全溯源码"
    acceptance:
      - "库存不足、单位不兼容和过期批次使用被拒绝。"
      - "库存变更与出库记录处于同一事务。"
      - "扫描溯源码可以查询菜品、批次、订单、供应商、验收、出库和留样信息。"

  - id: LEDGER-CONFIG-001
    priority: P0
    category: ledger
    statement: "台账类型、频次、模板、必填字段和责任人可以配置，周期内未完成项可以动态跟踪。"
    source:
      - document: overview-design
        section: "3.5 台账管理"
      - document: phase2-design
        section: "3.2.18 台账预警"
    acceptance:
      - "周期开始自动生成应完成台账和当前预警。"
      - "完成一项后只移除该项，全部完成后清除预警。"
      - "记录支持内容、照片、责任人和提交时间。"

  - id: SAFETY-001
    priority: P1
    category: food-safety
    statement: "证照、健康证、管理制度、供应商资质和厨余企业信息可维护并支持临期提醒。"
    source:
      - document: overview-design
        section: "3.3 基础信息模块"
    acceptance:
      - "许可证和健康证具有有效期、附件、审核状态和变更记录。"
      - "临期和过期记录自动进入预警中心。"

  - id: ALERT-001
    priority: P1
    category: alert
    statement: "预警支持规则配置、生成、通知、处置、附件和统计。"
    source:
      - document: phase2-design
        section: "3.2.4 预警中心"
    acceptance:
      - "规则按学校、预警类别、通知人员和通知方式配置。"
      - "同一外部事件重复上送不重复建档。"
      - "处置记录包含操作人、时间、内容和附件。"

  - id: REPORT-001
    priority: P1
    category: statistics
    statement: "学校端和监管端可以查询采购、库存、台账、风险、评分和趋势统计。"
    source:
      - document: overview-design
        section: "3.7 采购统计; 3.8 综合统计; 3.9 市级数据中心"
      - document: phase2-design
        section: "3.2.10 智慧食堂大屏; 3.2.12 主食材价格监管"
    acceptance:
      - "统计可按时间、学校、食堂、供应商、食材和状态筛选。"
      - "导出数据与页面统计口径一致。"
      - "监管端只能查看授权区域。"

  - id: EXTERNAL-001
    priority: P2
    category: integration
    statement: "明厨亮灶、区县平台、晨检仪、电子秤、标签打印机和通知服务通过可替换适配器接入。"
    source:
      - document: phase2-design
        section: "3.2.1～3.2.11 外部平台与设备"
    acceptance:
      - "没有凭据时适配器返回明确配置错误，不伪装为已连接。"
      - "外部数据先归一化再进入核心领域。"
      - "外部调用具备超时、重试、幂等和原始报文审计。"

  - id: EVALUATION-001
    priority: P2
    category: evaluation
    statement: "系统支持食堂满意度调查和供应商评价。"
    source:
      - document: phase2-design
        section: "3.2.17～3.2.19"
    acceptance:
      - "评价周期、问卷、题目、答卷、得分和排名可查询。"

  - id: WXMP-001
    priority: P0
    category: channel
    statement: "微信小程序提供扫码登录、食谱查看和台账记录三项最小可用访问能力。"
    source:
      - document: overview-design
        section: "2.1.1 移动端; 3.1.2 移动端登录入口; 3.1.4 当日概览; 5.5.1 微信小程序接口"
    acceptance:
      - "用户可以通过微信授权完成身份绑定、会话建立和登录失败提示。"
      - "登录后可以查看授权食堂食谱并提交台账记录，接口明确真实微信凭据属于联调前置条件。"

  - id: SYS-ANNOUNCEMENT-001
    priority: P1
    category: system-management
    statement: "管理部门可以创建、审核、发布和撤回通知公告，学校只能查看其授权范围内的公告。"
    source:
      - document: overview-design
        section: "3.2.2 系统管理模块（通知公告管理）"
    acceptance:
      - "公告具有草稿、待审核、已发布和已撤回状态，发布范围与发布时间可追溯。"
      - "学校端只能读取已发布且命中本校范围的公告，撤回后不再出现在公开列表。"

  - id: SYS-CANTEEN-STYLE-001
    priority: P1
    category: system-management
    statement: "学校可以维护食堂风采内容，管理部门审核后才能发布展示。"
    source:
      - document: overview-design
        section: "3.2.2 系统管理模块（食堂风采管理）"
    acceptance:
      - "风采支持内容编辑、图片附件、提交审核、审核驳回和重新提交。"
      - "只有审核通过的版本可以对授权访问者展示，历史版本和审核意见可追溯。"

  - id: MEAL-SUSPENSION-001
    priority: P1
    category: system-management
    statement: "学校可以提交停餐报备，管理部门可以审核、查询和统计停餐信息。"
    source:
      - document: overview-design
        section: "3.2.2 系统管理模块（停餐报备）"
    acceptance:
      - "停餐报备记录停餐食堂、日期、餐次、原因、提交人和审核状态。"
      - "管理部门可以按学校、食堂、日期和状态查询统计，审核结果和修改历史可追溯。"

  - id: COMPLAINT-001
    priority: P1
    category: system-management
    statement: "学校可以针对供应商提交投诉建议，管理部门可以受理、跟踪、统计并关闭处理流程。"
    source:
      - document: overview-design
        section: "3.2.2 系统管理模块（投诉建议）"
    acceptance:
      - "投诉建议包含供应商、问题描述、附件、提交人、处理状态和处理时限。"
      - "受理、处理中、已回复和已关闭的每次状态变化都记录处理人、时间和结果。"

  - id: KNOWLEDGE-001
    priority: P2
    category: system-management
    statement: "知识库支持法规制度和安全知识的分类维护、审核发布以及学校按授权范围查看。"
    source:
      - document: overview-design
        section: "3.2.2 系统管理模块（知识库）"
    acceptance:
      - "知识内容具有分类、版本、附件、发布范围、审核状态和生效时间。"
      - "管理部门发布的内容可以被授权学校检索和查看，撤回或过期内容不进入有效结果。"

  - id: SETTLEMENT-001
    priority: P1
    category: settlement
    statement: "系统可以按自定义结算周期汇总未结算采购单，生成供应商结算单并支持审核和历史查询。"
    source:
      - document: overview-design
        section: "3.6.2 采购管理模块（结算管理）"
      - document: phase2-design
        section: "3.2.13 采购管理"
    acceptance:
      - "结算单按食堂、供应商和结算周期幂等生成，明细可追溯到验收合格数量和金额。"
      - "结算单支持审核、驳回、确认和历史查询，已确认单据不能静默修改。"

  - id: COST-001
    priority: P1
    category: settlement
    statement: "系统记录餐费收入和各类支出，自动计算成本指标并生成可审核、可公示的成本核算结果。"
    source:
      - document: overview-design
        section: "3.6.2 采购管理模块（成本核算）; 3.7 采购统计"
    acceptance:
      - "收入、支出、成本分类、统计周期和来源凭证可维护，计算口径和金额可复核。"
      - "成本核算结果支持审核、提交公示、锁定和历史查询，公示版本不可静默覆盖。"

  - id: CITY-001
    priority: P1
    category: city-platform
    statement: "系统通过市级平台约定的认证、签名、全量/增量上报和数据质量流程完成数据中心对接。"
    source:
      - document: overview-design
        section: "3.9 市级数据中心模块; 5.5.2 市级数据中心接口"
      - document: phase2-design
        section: "3.2.3 市级平台数据接入"
    acceptance:
      - "使用 clientId、clientSecret 获取 accessToken，并按 timestamp 和签名规则校验每次请求。"
      - "支持全量和增量数据上报、字段转换、数据质量校验、失败重试、同步监控和 T+1 汇总。"

  - id: BRIGHT-001
    priority: P2
    category: integration
    statement: "明厨亮灶适配器支持机构和摄像头同步、实时/回放视频、AI告警和单点登录边界。"
    source:
      - document: phase2-design
        section: "3.2.1 明厨亮灶平台"
    acceptance:
      - "机构和摄像头同步具备映射、停用和同步日志，实时与回放访问均校验授权。"
      - "AI警情和单点登录结果先归一化并记录原始来源，凭据或厂商服务不可用时明确失败。"

  - id: DEVICE-001
    priority: P2
    category: integration
    statement: "晨检仪、高拍仪、电子秤和标签打印机通过统一设备管理和同步日志接入。"
    source:
      - document: phase2-design
        section: "3.2.6 晨检仪; 3.2.7 高拍仪; 3.2.8 电子秤; 3.2.9 标签打印机; 3.2.10～3.2.11 设备管理"
    acceptance:
      - "设备可以注册、绑定食堂、同步人员或业务数据，并能查询在线状态和最近同步结果。"
      - "调用具备超时、重试、幂等、失败日志和人工补录入口，不因设备失败伪造业务成功。"

  - id: PRICE-001
    priority: P1
    category: statistics
    statement: "系统维护主食材基准价，分析采购价偏差并按阈值生成监管预警和导出结果。"
    source:
      - document: overview-design
        section: "3.7 采购统计"
      - document: phase2-design
        section: "3.2.12 主食材价格监管"
    acceptance:
      - "基准价支持导入、版本、生效日期、食材和区域范围，异常数据有失败明细。"
      - "采购价偏差按配置阈值分析，结果可查询、预警、复核和导出。"

  - id: CONTENT-001
    priority: P2
    category: content
    statement: "百科知识和批量食谱导入支持多格式内容、区域下钻、模板校验、失败明细和审批发布。"
    source:
      - document: phase2-design
        section: "3.2.15 食堂百科; 3.2.16 食谱管理"
    acceptance:
      - "知识内容支持多格式附件和按区域、学校、食堂下钻查看，发布范围可审计。"
      - "批量导入提供模板、字段和业务校验、失败明细、重试以及审批后发布。"

  - id: PLATFORM-001
    priority: P1
    category: platform
    statement: "微信、短信、对象存储、缓存、消息队列和备份监控等平台能力通过明确配置契约和可观测性接入。"
    source:
      - document: overview-design
        section: "2.3 逻辑架构; 5.5 基础支撑层; 6 非功能需求; 7 部署架构"
    acceptance:
      - "缺少真实凭据时相关适配器明确返回配置错误，不能伪装为已连接或已发送。"
      - "外部调用、通知、缓存、消息、备份和恢复具有超时/重试/审计/监控指标及故障演练记录。"
